<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Sales Xray lens, your report is ready">
  <style>
    .lx-smile { stroke-dasharray: 40; stroke-dashoffset: 40; animation: lx-smile .7s .15s cubic-bezier(.2,.8,.2,1) forwards; }
    .lx-spark { opacity: 0; transform-box: fill-box; transform-origin: center; animation: lx-spark 1.4s cubic-bezier(.2,.8,.2,1) forwards; }
    .lx-spark.s2 { animation-delay: .25s } .lx-spark.s3 { animation-delay: .4s } .lx-spark.s4 { animation-delay: .55s }
    .lx-pop { transform-box: fill-box; transform-origin: center; animation: lx-pop .6s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes lx-smile { to { stroke-dashoffset: 0 } }
    @keyframes lx-spark { 0% { opacity: 0; transform: scale(.2) rotate(-30deg) } 40% { opacity: 1; transform: scale(1.15) rotate(0) } 100% { opacity: 1; transform: scale(1) } }
    @keyframes lx-pop { from { transform: scale(.86) } to { transform: scale(1) } }
    @media (prefers-reduced-motion: reduce) { .lx-smile, .lx-spark, .lx-pop { animation: none; stroke-dashoffset: 0; opacity: 1 } }
  </style>
  <defs>
    <filter id="lx-glow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="lx-aperture" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="var(--lx-film-2, #16233A)"/>
      <stop offset="1" stop-color="var(--lx-film, #0A1220)"/>
    </radialGradient>
  </defs>
  <g class="lx-pop">
    <rect x="9" y="50" width="9" height="20" rx="4.5" fill="var(--lx-ink, #0E1726)"/>
    <rect x="102" y="50" width="9" height="20" rx="4.5" fill="var(--lx-ink, #0E1726)"/>
    <circle cx="60" cy="60" r="44" fill="var(--lx-paper, #FFFFFF)" stroke="var(--lx-ink, #0E1726)" stroke-width="5"/>
    <circle cx="60" cy="60" r="30" fill="url(#lx-aperture)"/>
    <path d="M42 47 A22 22 0 0 1 56 39" fill="none" stroke="#FFFFFF" stroke-opacity=".38" stroke-width="3" stroke-linecap="round"/>
    <path class="lx-smile" d="M46 57 Q60 71 74 57" fill="none" stroke="var(--lx-glow, #2DD4BF)" stroke-width="5" stroke-linecap="round" filter="url(#lx-glow)"/>
  </g>
  <g fill="var(--lx-focus, #D97706)">
    <path class="lx-spark"    d="M100 14 l2.4 6.6 6.6 2.4 -6.6 2.4 -2.4 6.6 -2.4 -6.6 -6.6 -2.4 6.6 -2.4z"/>
  </g>
  <g fill="var(--lx-strength, #0F8B7E)">
    <path class="lx-spark s2" d="M16 18 l1.8 4.9 4.9 1.8 -4.9 1.8 -1.8 4.9 -1.8 -4.9 -4.9 -1.8 4.9 -1.8z"/>
  </g>
  <g fill="var(--lx-missed, #6D4AFF)">
    <path class="lx-spark s3" d="M108 96 l1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6 -4.4 -4.4 -1.6 4.4 -1.6z"/>
  </g>
  <g fill="var(--lx-glow-ink, #0F8B7E)">
    <path class="lx-spark s4" d="M12 98 l1.3 3.5 3.5 1.3 -3.5 1.3 -1.3 3.5 -1.3 -3.5 -3.5 -1.3 3.5 -1.3z"/>
  </g>
</svg>
