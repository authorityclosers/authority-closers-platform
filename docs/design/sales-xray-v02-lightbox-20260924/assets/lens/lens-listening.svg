<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Sales Xray lens, listening to the call">
  <style>
    .lx-bar { animation: lx-eq 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .lx-bar:nth-child(2) { animation-delay: -.15s } .lx-bar:nth-child(3) { animation-delay: -.45s }
    .lx-bar:nth-child(4) { animation-delay: -.3s }  .lx-bar:nth-child(5) { animation-delay: -.6s }
    .lx-wave { animation: lx-wave 2.2s ease-out infinite; opacity: 0; transform-box: fill-box; }
    .lx-wave.l { transform-origin: right center } .lx-wave.r { transform-origin: left center }
    .lx-wave.d2 { animation-delay: .73s } .lx-wave.d3 { animation-delay: 1.46s }
    @keyframes lx-eq { 0%,100% { transform: scaleY(.35) } 50% { transform: scaleY(1) } }
    @keyframes lx-wave { 0% { opacity: .0; transform: scale(.6) } 15% { opacity: .9 } 100% { opacity: 0; transform: scale(1.35) } }
    @media (prefers-reduced-motion: reduce) { .lx-bar, .lx-wave { animation: none } .lx-wave { opacity: .5 } }
  </style>
  <defs>
    <filter id="lx-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="lx-aperture" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="var(--lx-film-2, #16233A)"/>
      <stop offset="1" stop-color="var(--lx-film, #0A1220)"/>
    </radialGradient>
  </defs>
  <path class="lx-wave l"    d="M7 46 A16 16 0 0 0 7 74" fill="none" stroke="var(--lx-glow-ink, #0F8B7E)" stroke-width="3" stroke-linecap="round"/>
  <path class="lx-wave l d2" d="M7 46 A16 16 0 0 0 7 74" fill="none" stroke="var(--lx-glow-ink, #0F8B7E)" stroke-width="3" stroke-linecap="round"/>
  <path class="lx-wave l d3" d="M7 46 A16 16 0 0 0 7 74" fill="none" stroke="var(--lx-glow-ink, #0F8B7E)" stroke-width="3" stroke-linecap="round"/>
  <path class="lx-wave r"    d="M113 46 A16 16 0 0 1 113 74" fill="none" stroke="var(--lx-glow-ink, #0F8B7E)" stroke-width="3" stroke-linecap="round"/>
  <path class="lx-wave r d2" d="M113 46 A16 16 0 0 1 113 74" fill="none" stroke="var(--lx-glow-ink, #0F8B7E)" stroke-width="3" stroke-linecap="round"/>
  <path class="lx-wave r d3" d="M113 46 A16 16 0 0 1 113 74" fill="none" stroke="var(--lx-glow-ink, #0F8B7E)" stroke-width="3" stroke-linecap="round"/>
  <rect x="13" y="50" width="9" height="20" rx="4.5" fill="var(--lx-ink, #0E1726)"/>
  <rect x="98" y="50" width="9" height="20" rx="4.5" fill="var(--lx-ink, #0E1726)"/>
  <circle cx="60" cy="60" r="40" fill="var(--lx-paper, #FFFFFF)" stroke="var(--lx-ink, #0E1726)" stroke-width="5"/>
  <circle cx="60" cy="60" r="27" fill="url(#lx-aperture)"/>
  <path d="M43 48 A20 20 0 0 1 56 41" fill="none" stroke="#FFFFFF" stroke-opacity=".38" stroke-width="3" stroke-linecap="round"/>
  <g fill="var(--lx-glow, #2DD4BF)" filter="url(#lx-glow)">
    <rect class="lx-bar" x="46" y="50" width="4" height="20" rx="2"/>
    <rect class="lx-bar" x="52.5" y="46" width="4" height="28" rx="2"/>
    <rect class="lx-bar" x="59" y="43" width="4" height="34" rx="2"/>
    <rect class="lx-bar" x="65.5" y="46" width="4" height="28" rx="2"/>
    <rect class="lx-bar" x="72" y="50" width="4" height="20" rx="2"/>
  </g>
</svg>
