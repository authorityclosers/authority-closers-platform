<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" role="img" aria-label="Sales Xray lens, writing your coaching report">
  <style>
    .lx-ink-line { stroke-dasharray: 60; stroke-dashoffset: 60; animation: lx-draw 3s ease-in-out infinite; }
    .lx-ink-line.l2 { animation-delay: .5s } .lx-ink-line.l3 { animation-delay: 1s }
    .lx-pen { stroke-dasharray: 34; stroke-dashoffset: 34; animation: lx-pen 1.5s ease-in-out infinite; }
    .lx-bob { animation: lx-bob 1.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes lx-draw { 0% { stroke-dashoffset: 60 } 45%,80% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: -60 } }
    @keyframes lx-pen { 0% { stroke-dashoffset: 34 } 60%,100% { stroke-dashoffset: 0 } }
    @keyframes lx-bob { 0%,100% { transform: rotate(-3deg) } 50% { transform: rotate(3deg) } }
    @media (prefers-reduced-motion: reduce) { .lx-ink-line, .lx-pen, .lx-bob { animation: none; stroke-dashoffset: 0 } }
  </style>
  <defs>
    <filter id="lx-glow" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="lx-aperture" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="var(--lx-film-2, #16233A)"/>
      <stop offset="1" stop-color="var(--lx-film, #0A1220)"/>
    </radialGradient>
  </defs>
  <g class="lx-bob">
    <rect x="13" y="42" width="9" height="20" rx="4.5" fill="var(--lx-ink, #0E1726)"/>
    <rect x="98" y="42" width="9" height="20" rx="4.5" fill="var(--lx-ink, #0E1726)"/>
    <circle cx="60" cy="52" r="40" fill="var(--lx-paper, #FFFFFF)" stroke="var(--lx-ink, #0E1726)" stroke-width="5"/>
    <circle cx="60" cy="52" r="27" fill="url(#lx-aperture)"/>
    <path d="M43 40 A20 20 0 0 1 56 33" fill="none" stroke="#FFFFFF" stroke-opacity=".38" stroke-width="3" stroke-linecap="round"/>
    <path class="lx-pen" d="M43 55 q5 -8 9 0 t9 0 t9 0 t6 -2" fill="none" stroke="var(--lx-glow, #2DD4BF)" stroke-width="3.5" stroke-linecap="round" filter="url(#lx-glow)"/>
  </g>
  <rect x="22" y="100" width="76" height="34" rx="7" fill="var(--lx-paper, #FFFFFF)" stroke="var(--lx-line, #D9DEE7)" stroke-width="2"/>
  <path class="lx-ink-line"    d="M32 110 h56" stroke="var(--lx-ink, #0E1726)" stroke-width="3" stroke-linecap="round"/>
  <path class="lx-ink-line l2" d="M32 118 h44" stroke="var(--lx-muted, #5B6678)" stroke-width="3" stroke-linecap="round"/>
  <path class="lx-ink-line l3" d="M32 126 h50" stroke="var(--lx-muted, #5B6678)" stroke-width="3" stroke-linecap="round"/>
</svg>
