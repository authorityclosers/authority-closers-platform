<html lang="en">
<head>
<meta charset="utf-8">

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Plus+Jakarta+Sans:wght@400..800&amp;family=Noto+Sans+Devanagari:wght@400..700&amp;display=swap">
<style>
body{margin:0;background:#F6F5F1;color:#0B1424;font-family:"Plus Jakarta Sans","Noto Sans Devanagari",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#087E79}a:hover{color:#06635F}
@keyframes lxEq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes lxWave{0%{opacity:0;transform:scale(.6)}15%{opacity:.9}100%{opacity:0;transform:scale(1.35)}}
@keyframes lxRing{0%{box-shadow:0 0 0 0 rgba(45,212,191,.55)}100%{box-shadow:0 0 0 10px rgba(45,212,191,0)}}
.lx-eq{animation:lxEq 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.lx-wave{animation:lxWave 2.2s ease-out infinite;opacity:0;transform-box:fill-box}
.lx-ring{animation:lxRing 1.8s ease-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #F6F5F1; overflow: hidden; display: flex; flex-direction: column">
  <header style="height: 60px; flex: none; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px">
    <a href="Library.dc.html" aria-label="Back to calls" style="width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #0B1424"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <span style="font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Site visit follow-up · Mehta</span>
  </header>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 4px 18px 0">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.08; letter-spacing: -0.03em">Listening to your call</h1>

    <section aria-label="Analysis progress" style="display: flex; flex-direction: column; gap: 14px; padding: 20px 18px; border-radius: 24px; background-color: #0A1220; background-image: radial-gradient(ellipse at 50% 0%, rgba(45,212,191,.2), rgba(10,18,32,0) 60%); box-shadow: 0 24px 44px -26px rgba(10,18,32,.6)">
      <div style="display: flex; justify-content: center">
        <svg width="132" height="132" viewBox="0 0 120 120" aria-hidden="true">
          <defs><filter id="gMP" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter><radialGradient id="aMP" cx="50%" cy="42%" r="62%"><stop offset="0" stop-color="#16233A"></stop><stop offset="1" stop-color="#050A14"></stop></radialGradient></defs>
          <path class="lx-wave" d="M7 46 A16 16 0 0 0 7 74" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" style="transform-origin: right center"></path>
          <path class="lx-wave" d="M7 46 A16 16 0 0 0 7 74" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" style="transform-origin: right center; animation-delay: .73s"></path>
          <path class="lx-wave" d="M113 46 A16 16 0 0 1 113 74" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" style="transform-origin: left center"></path>
          <path class="lx-wave" d="M113 46 A16 16 0 0 1 113 74" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" style="transform-origin: left center; animation-delay: .73s"></path>
          <rect x="13" y="50" width="9" height="20" rx="4.5" fill="#E8EDF5"></rect><rect x="98" y="50" width="9" height="20" rx="4.5" fill="#E8EDF5"></rect>
          <circle cx="60" cy="60" r="40" fill="#FFFFFF" stroke="#E8EDF5" stroke-width="5"></circle><circle cx="60" cy="60" r="27" fill="url(#aMP)"></circle>
          <g fill="#2DD4BF" filter="url(#gMP)">
            <rect class="lx-eq" x="46" y="50" width="4" height="20" rx="2"></rect>
            <rect class="lx-eq" x="52.5" y="46" width="4" height="28" rx="2" style="animation-delay: -.15s"></rect>
            <rect class="lx-eq" x="59" y="43" width="4" height="34" rx="2" style="animation-delay: -.45s"></rect>
            <rect class="lx-eq" x="65.5" y="46" width="4" height="28" rx="2" style="animation-delay: -.3s"></rect>
            <rect class="lx-eq" x="72" y="50" width="4" height="20" rx="2" style="animation-delay: -.6s"></rect>
          </g>
        </svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; gap: 12px; align-items: center; padding: 10px 0"><span style="width: 28px; height: 28px; flex: none; border-radius: 50%; background: #2DD4BF; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0A1220" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="flex-grow: 1; font-size: 14.5px; font-weight: 800; color: #FFFFFF">Recording checked</span><span style="font-size: 11.5px; font-weight: 700; color: #2DD4BF">Saved</span></div>
        <div style="display: flex; gap: 12px; align-items: center; padding: 10px 12px; margin: 0 -12px; border-radius: 14px; background: rgba(45,212,191,.08); border: 1px solid rgba(45,212,191,.25)"><span class="lx-ring" style="width: 28px; height: 28px; flex: none; border-radius: 50%; border: 2px solid #2DD4BF; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 50%; background: #2DD4BF"></span></span><span style="flex-grow: 1; font-size: 14.5px; font-weight: 800; color: #FFFFFF">Listening</span><span style="font-size: 11.5px; font-weight: 700; color: #FFFFFF">In progress</span></div>
        <div style="display: flex; gap: 12px; align-items: center; padding: 10px 0; opacity: .7"><span style="width: 28px; height: 28px; flex: none; border-radius: 50%; border: 2px dashed rgba(201,212,227,.45); box-sizing: border-box"></span><span style="flex-grow: 1; font-size: 14.5px; font-weight: 800; color: #FFFFFF">Understanding</span><span style="font-size: 11.5px; font-weight: 700; color: #9FB0C8">Next</span></div>
        <div style="display: flex; gap: 12px; align-items: center; padding: 10px 0; opacity: .7"><span style="width: 28px; height: 28px; flex: none; border-radius: 50%; border: 2px dashed rgba(201,212,227,.45); box-sizing: border-box"></span><span style="flex-grow: 1; font-size: 14.5px; font-weight: 800; color: #FFFFFF">Writing your coaching</span><span style="font-size: 11.5px; font-weight: 700; color: #9FB0C8">Later</span></div>
      </div>
      <span role="status" style="font-size: 12px; color: #9FB0C8; text-align: center">Last confirmed update 5 seconds ago · no guessed timers</span>
    </section>

    <div style="display: flex; gap: 12px; align-items: center; padding: 14px 16px; background: #FFFFFF; border: 1px solid #E6E3DA; border-radius: 18px">
      <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #E6F5F2; color: #087E79; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12v17l-6-4-6 4z"></path><path d="M9 9.5l2 2 4-4"></path></svg></span>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 800">You can leave this screen</span><span style="font-size: 12.5px; line-height: 1.45; color: #6B7486">We keep working. Find the report in Calls.</span></div>
    </div>
  </div>

  <nav aria-label="Main" style="height: 76px; flex: none; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 8px 12px 14px; background: #FFFFFF; border-top: 1px solid #E6E3DA">
    <a href="Mobile-Upload.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 14px; color: #56637A; font-size: 11.5px; font-weight: 700; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New</a>
    <a href="Library.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 14px; background: #EEF6F4; color: #06635F; font-size: 11.5px; font-weight: 800; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18h18"></path><path d="M6 18v-5M10 18V8M14 18v-8M18 18v-3"></path></svg>Calls</a>
    <a href="Mobile-Upload.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 14px; color: #56637A; font-size: 11.5px; font-weight: 700; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5.5 19.5c.8-3.4 3.4-5.5 6.5-5.5s5.7 2.1 6.5 5.5"></path></svg>Account</a>
  </nav>
</div>
</x-dc>
