# Dev Admin reads the metrics store (19 Oct 2026): only dev and staging, read-only.
# Install as /etc/systemd/system/ac-dev-live-api.service.d/zz-metrics-store.conf.
[Service]
BindReadOnlyPaths=-/srv/authority-closers/metrics/development -/srv/authority-closers/metrics/staging
Environment=AC_METRICS_STORE_ROOT=/srv/authority-closers/metrics
