# Apply last to the FOUNDATION project, never to the application project.
services:
  edge-router:
    mem_limit: 64m
    memswap_limit: 64m
    oom_score_adj: -500
    restart: unless-stopped
  telemetry-collector:
    mem_limit: 64m
    memswap_limit: 64m
    oom_score_adj: 500
    restart: unless-stopped
    environment:
      GOMEMLIMIT: 48MiB
    volumes:
      - type: bind
        source: ${AC_LEAN_OTEL_CONFIG_FILE:?reviewed lean collector config required}
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
        bind:
          create_host_path: false
