# Candidate only: do not install with the shipped native helper. A separately
# reviewed and packaged lean helper must use LeanDockerNativeRuntime with a
# 192 MiB child in native.slice before this combined budget can be admitted.
[Service]
Slice=native.slice
MemoryMax=64M
MemorySwapMax=0
OOMScoreAdjust=500
Nice=10
Restart=always
