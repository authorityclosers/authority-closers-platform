Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LocalSocket /run/ac-dev-organisation-avatar/clamd.sock
LocalSocketMode 666
# No TCP listener. Only the private dev API bind can reach this socket.
StreamMaxLength 2097152
MaxFileSize 2097152
MaxScanSize 8388608
AlertExceedsMax yes
MaxThreads 1
MaxQueue 2
MaxRecursion 17
MaxFiles 1000
MaxScanTime 20000
ReadTimeout 30
CommandReadTimeout 10
SelfCheck 60
ConcurrentDatabaseReload no
BytecodeSecurity TrustSigned
LogTime yes
LogClean no
LogVerbose no
