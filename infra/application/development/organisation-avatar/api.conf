[Unit]
Requires=ac-dev-organisation-avatar.service
After=ac-dev-organisation-avatar.service

[Service]
# Installed only after sensitive review and merge, never loaded by default.
BindReadOnlyPaths=/run/ac-dev-organisation-avatar
Environment=AC_MEDIA_DEVELOPMENT_ORGANISATION_AVATAR_ENABLED=true
Environment=AC_MEDIA_DEVELOPMENT_ORGANISATION_AVATAR_ROOT=/srv/authority-closers/sales-xray/development/avatar-objects
Environment=AC_MEDIA_DEVELOPMENT_ORGANISATION_AVATAR_SCANNER_SOCKET=/run/ac-dev-organisation-avatar/clamd.sock
