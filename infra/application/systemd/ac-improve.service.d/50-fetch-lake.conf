# The engine reads only local lake parts. Fetch both environments' committed
# manifests and their exact parts first, as root, with the archive helper's
# Infisical credentials (orchestrator, 29 Oct 2026). The service runs at a
# quarter of a CPU, so the fetch and both reports get 30 minutes.
[Service]
ExecStartPre=+/usr/local/sbin/ac-improve-fetch production
ExecStartPre=+/usr/local/sbin/ac-improve-fetch dev
TimeoutStartSec=30min
