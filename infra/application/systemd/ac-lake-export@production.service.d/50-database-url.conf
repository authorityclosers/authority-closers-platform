# Production lake export (owner approval 29 Oct 2026: pseudonymised analytics and Lead Desk
# event metadata to the private S3 archive in Sydney, kept under 180 days). The database
# address is built at start from the production API's own setting and lives only in this
# private runtime directory while the export runs. Install: docs/data/lake-queries.md.
[Service]
RuntimeDirectory=ac-lake-export-production
RuntimeDirectoryMode=0700
ExecStartPre=+/usr/local/sbin/ac-lake-database-url production /run/ac-lake-export-production/database-url
