name: External foundation health

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate public tunnel health
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --max-time 15 \
            https://infra.dipakvishwakarma.com/healthz
