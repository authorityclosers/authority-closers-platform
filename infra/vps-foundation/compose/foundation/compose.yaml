name: ac-foundation

services:
  edge-router:
    image: ${CADDY_IMAGE:?CADDY_IMAGE must be pinned by digest}
    container_name: ac-edge-router
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The upstream Caddy binary carries this file capability; retain only that
    # capability in the container bounding set even though it listens on 8080.
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    cpus: 0.50
    mem_limit: 128m
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /config:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000
      - /data:rw,noexec,nosuid,nodev,size=32m,uid=1000,gid=1000
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  telemetry-collector:
    image: ${OTEL_IMAGE:?OTEL_IMAGE must be pinned by digest}
    container_name: ac-telemetry-collector
    restart: unless-stopped
    read_only: true
    init: true
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    cpus: 0.50
    mem_limit: 256m
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    networks:
      - telemetry
    expose:
      - "4317"
      - "4318"
      - "8889"
      - "13133"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

networks:
  edge:
    name: ac_edge
    external: true
  telemetry:
    name: ac_telemetry
    external: true
