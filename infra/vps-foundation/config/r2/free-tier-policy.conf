# Conservative operating envelope below Cloudflare R2's monthly free allowance.
# 8 GiB is below the 10 GB-month Standard-storage allowance.
R2_MAX_STANDARD_BYTES=8589934592
R2_MAX_CLASS_A_MONTH=700000
R2_MAX_CLASS_B_MONTH=7000000
R2_FORBID_INFREQUENT_ACCESS=1

# Logical PostgreSQL model: two possible application environments, a 27-hour
# retained window at 5-minute cadence, plus a small cadence/jitter buffer.
# 8 MiB is a deliberate initial bound, not a claim about long-term capacity.
# Migrate to reviewed continuous WAL/PITR before compressed dumps approach it.
R2_POSTGRES_LOGICAL_MAX_DUMP_BYTES=8388608
R2_POSTGRES_LOGICAL_RETENTION_POINTS_PER_ENVIRONMENT=336
R2_POSTGRES_LOGICAL_MAX_ENVIRONMENTS=2

R2_BACKUP_BUCKET=authority-closers-backups-prod
R2_OBJECT_BUCKET=authority-closers-objects-prod
