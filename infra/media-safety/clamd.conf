# Fixed pilot policy: at most 2,000,000,000 decimal source bytes; limits are rejected, never clean.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
LocalSocketMode 600
TCPSocket 3310
TCPAddr 0.0.0.0
StreamMaxLength 2000000000
MaxFileSize 2000000000
MaxScanSize 4000000000
AlertExceedsMax yes
MaxThreads 2
MaxQueue 4
MaxRecursion 17
MaxFiles 1000
MaxScanTime 900000
ReadTimeout 120
CommandReadTimeout 10
SendBufTimeout 500
SelfCheck 60
ConcurrentDatabaseReload yes
BytecodeSecurity TrustSigned
LogTime yes
LogClean no
LogVerbose no
