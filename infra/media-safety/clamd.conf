# Fixed pilot policy: at most 2,000,000,000 decimal source bytes; limits are rejected, never clean.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /var/lib/ac-media-safety-tmp
LocalSocket /run/ac-media-safety/clamd.sock
LocalSocketMode 666
TCPSocket 3310
TCPAddr 0.0.0.0
StreamMaxLength 2000000000
MaxFileSize 2000000000
MaxScanSize 4000000000
AlertExceedsMax yes
MaxThreads 2
# The dedicated disk workspace is sized for two active 4,000,000,000-byte
# scans. The queue is bounded so a request burst cannot grow temp storage.
MaxQueue 2
MaxRecursion 17
MaxFiles 1000
MaxScanTime 900000
ReadTimeout 120
CommandReadTimeout 10
SendBufTimeout 500
SelfCheck 60
ConcurrentDatabaseReload yes
BytecodeSecurity TrustSigned
LogTime yes
LogClean no
LogVerbose no
