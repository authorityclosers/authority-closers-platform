# Fixed pilot policy: at most 100 MiB source bytes; limits are rejected, never clean.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
LocalSocketMode 600
TCPSocket 3310
TCPAddr 0.0.0.0
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 200M
AlertExceedsMax yes
MaxThreads 2
MaxQueue 4
MaxRecursion 17
MaxFiles 1000
MaxScanTime 60000
ReadTimeout 120
CommandReadTimeout 10
SendBufTimeout 500
SelfCheck 60
ConcurrentDatabaseReload yes
BytecodeSecurity TrustSigned
LogTime yes
LogClean no
LogVerbose no
