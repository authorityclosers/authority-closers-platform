<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sales Xray</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1220;
        color: #e6edf6;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #9fb0c6; max-width: 32ch; }
      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        background: #2dd4bf;
        color: #04221d;
        font: 600 15px/1 inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sales Xray can't be reached</h1>
      <p>Check your internet connection, then try again. Your call recordings stay on this phone.</p>
      <button type="button" onclick="location.replace('https://salesxray.authorityclosers.com/')">Try again</button>
    </main>
  </body>
</html>
