<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    Sales Xray v0.2 "Lightbox" glyph sprite. 24px grid, 1.75 stroke, round caps/joins, currentColor.
    Use: <svg class="lx-glyph" width="20" height="20" aria-hidden="true"><use href="/lightbox/lightbox-glyphs.svg#lx-strength"/></svg>
    Semantic colour comes from the parent (see DESIGN_SPEC.md §4.3), never from the glyph.
  -->

  <!-- Moment kinds -->
  <symbol id="lx-strength" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M7.8 12.6l2.7 2.6 5.7-6.2"/>
  </symbol>
  <symbol id="lx-focus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/>
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 1.8v3.4M12 18.8v3.4M1.8 12h3.4M18.8 12h3.4"/>
    <circle cx="12" cy="12" r=".9" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="lx-missed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.8l9.2 9.2-9.2 9.2L2.8 12z"/>
    <path d="M12 8.2v4.6"/>
    <circle cx="12" cy="16" r=".95" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="lx-hypothesis" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9" stroke-dasharray="2.6 2.9"/>
    <path d="M9.6 9.4a2.5 2.5 0 1 1 3.6 2.3c-.8.4-1.2.9-1.2 1.8"/>
    <circle cx="12" cy="16.6" r=".95" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="lx-objection" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 5.5h16v10H11l-4.5 3.5v-3.5H4z"/>
    <path d="M9 9l6 3M15 9l-6 3"/>
  </symbol>

  <!-- Evidence & playback -->
  <symbol id="lx-quote" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
