    <path d="M2.8 19.5c.8-3.2 3.3-5.3 6.2-5.3 1.5 0 2.9.5 4 1.5"/>
    <circle cx="17.5" cy="16.5" r="3.2"/><path d="M19.8 18.8L22 21"/>
