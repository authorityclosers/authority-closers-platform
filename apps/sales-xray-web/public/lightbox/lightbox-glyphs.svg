  <symbol id="lx-seek-moment" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12h3M8 8v8M11 5v14M14 9v6M17 7v10M20 11v2"/>
    <path d="M11 2.5l-1.6 1.6M11 2.5l1.6 1.6" />
