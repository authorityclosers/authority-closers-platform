    <path d="M8 9l1.6 1.6L12.5 7.8M8 15l1.6 1.6 2.9-2.8M14.5 9.5H17M14.5 15.5H17"/>
  </symbol>
  <symbol id="lx-chapter-transcript" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 5h11M4 9h16M4 13h9M4 17h13"/>
    <path d="M17 13.5l2 2 2-2"/>
  </symbol>

  <!-- Journey -->
  <symbol id="lx-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 15.5V4M7.5 8.5L12 4l4.5 4.5"/>
    <path d="M4 14.5v3a2.5 2.5 0 0 0 2.5 2.5h11a2.5 2.5 0 0 0 2.5-2.5v-3"/>
  </symbol>
  <symbol id="lx-listen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 12h1.5M7.5 8v8M10.5 5v14M13.5 9v6M16.5 7v10M19.5 11v2"/>
  </symbol>
  <symbol id="lx-understand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.5 15.5L21 21"/>
    <path d="M7 10.5h1M9.2 8v5M11.6 9v3M14 10.5h.5"/>
  </symbol>
  <symbol id="lx-write" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14.5 4.5l5 5L9 20H4v-5z"/>
    <path d="M12.5 6.5l5 5"/>
