  <symbol id="lx-saved" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3.5h12v17l-6-4-6 4z"/>
    <path d="M9 9.5l2 2 4-4"/>
