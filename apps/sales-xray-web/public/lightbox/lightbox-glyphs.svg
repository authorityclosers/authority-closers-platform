  <symbol id="lx-skill-na" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
    <circle cx="12" cy="12" r="7.5"/>
    <path d="M8.5 12h7"/>
