    <path d="M7.5 9h9M7.5 12.5h6M7.5 16h4"/>
  </symbol>
  <symbol id="lx-chapter-moments" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
