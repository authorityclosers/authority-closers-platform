<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <meta
      name="theme-color"
      content="#f2f3f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#000000"
      media="(prefers-color-scheme: dark)"
    />
    <title>No internet · Sales X-Ray</title>
    <!--
      The in-app offline screen (v1.96 device polish, lane P). public/sw.js keeps this
      one file and shows it only when a page can't reach the network. It needs nothing
      else from the server: styles and script are inline, and it holds no one's data.
      Colours are the app's tokens (packages/typescript/ui/src/kit/tokens/palette.css).
    -->
    <style>
      :root {
        --paper: #f2f3f7;
        --surface: #ffffff;
        --ink: #0a0c10;
        --muted: #5b626e;
        --line: #e4e6eb;
        --tile: #eef0f4;
        --go: #045d56;
        --on-go: #ffffff;
        color-scheme: light;
      }
      html[data-theme="dark"] {
        --paper: #000000;
        --surface: #1c1c1e;
        --ink: #f5f5f7;
        --muted: #a1a1a8;
        --line: #2a2a2d;
        --tile: #2c2c2e;
        --go: #0f6b5f;
        --on-go: #ffffff;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--paper);
        color: var(--ink);
        font-family:
          "Plus Jakarta Sans Variable",
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        padding: calc(env(safe-area-inset-top, 0px) + 24px) 16px
          calc(env(safe-area-inset-bottom, 0px) + 24px);
      }
      main {
        display: grid;
        width: 100%;
        max-width: 420px;
        gap: 14px;
        justify-items: start;
        padding: 24px 22px 22px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--surface);
        box-shadow:
          0 1px 2px rgba(10, 12, 16, 0.05),
          0 8px 24px rgba(10, 12, 16, 0.06);
      }
      .tile {
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border-radius: 14px;
        background: var(--tile);
        color: var(--ink);
      }
      h1 {
        margin: 0;
        font-size: 1.375rem;
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.5;
      }
      button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 4px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        background: var(--go);
        color: var(--on-go);
        font: inherit;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid color-mix(in oklab, var(--go) 45%, transparent);
        outline-offset: 2px;
      }
      small {
        color: var(--muted);
        font-size: 0.8125rem;
      }
    </style>
    <script>
      // The app's saved theme, as the app reads it (lightbox/theme.ts themeInitScript): dark only when chosen.
      (function () {
        try {
          if (localStorage.getItem("sales-xray:theme") === "dark")
            document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <main aria-labelledby="title">
      <span class="tile" aria-hidden="true">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 20h.01" />
          <path d="M8.5 16.43a5 5 0 0 1 7 0" />
          <path d="M5 12.86a10 10 0 0 1 5.17-2.69" />
          <path d="M19 12.86a10 10 0 0 0-2-1.39" />
          <path d="M2 8.82a15 15 0 0 1 4.18-2.65" />
          <path d="M22 8.82a15 15 0 0 0-11.29-3.76" />
          <path d="m2 2 20 20" />
        </svg>
      </span>
      <h1 id="title">No internet</h1>
      <p>
        This screen opens once your phone is back online. What you saved is
        safe.
      </p>
      <button type="button" id="again">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
          <path d="M21 3v5h-5" />
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
          <path d="M8 16H3v5" />
        </svg>
        Try again
      </button>
      <small id="note" role="status" aria-live="polite"
        >Opens by itself when the internet is back.</small
      >
    </main>
    <script>
      (function () {
        var note = document.getElementById("note");
        function again() {
          if (navigator.onLine === false) {
            note.textContent =
              "Still no internet. Opens by itself when it's back.";
            return;
          }
          location.reload();
        }
        document.getElementById("again").addEventListener("click", again);
        window.addEventListener("online", function () {
          location.reload();
        });
      })();
    </script>
  </body>
</html>
