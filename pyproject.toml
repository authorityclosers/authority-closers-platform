[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "authority-closers-platform"
version = "0.1.0"
description = "Authority Closers Learning & Practice OS modular monolith"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.19.1",
  "cryptography==50.0.1",
  "fastapi==0.141.1",
  "google-auth[requests]==2.57.0",
  "httpx==0.28.1",
  "opentelemetry-api==1.44.0",
  "opentelemetry-instrumentation-fastapi==0.65b0",
  "opentelemetry-sdk==1.44.0",
  "psycopg[binary,pool]==3.3.4",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.52",
  "structlog==26.1.0",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.5",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/python/ac_platform"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["ac_platform"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ac_platform"]
mypy_path = ["packages/python"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
