name: Verified offline CI prerequisites
description: Install an immutable GitHub-hosted bundle and prove the locked tools and browser offline.
inputs:
  bundle:
    description: Exact artifact ID/digest and producer reference from the prerequisite producer job.
    required: true
  components:
    description: Space-separated prerequisite components.
    required: true
  python:
    description: Python executable with the frozen Playwright environment, or python3 for Node.
    default: .venv/bin/python
  node-browser:
    description: Use the frozen pnpm Playwright package instead of Python Playwright.
    default: "false"
runs:
  using: composite
  steps:
    - name: Make the Azure apt mirror unavailable on this disposable runner
      shell: bash
      run: |
        test "$GITHUB_ACTIONS" = true
        printf '\n127.0.0.1 azure.archive.ubuntu.com\n::1 azure.archive.ubuntu.com\n' | sudo --non-interactive tee -a /etc/hosts >/dev/null
    - name: Verify the producer and prove prerequisites offline
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PREREQ_BUNDLE: ${{ inputs.bundle }}
        PREREQ_COMPONENTS: ${{ inputs.components }}
        PREREQ_PYTHON: ${{ inputs.python }}
        PREREQ_NODE: ${{ inputs.node-browser }}
      run: |
        read -r -a components <<< "$PREREQ_COMPONENTS"
        options=(); [ "$PREREQ_NODE" != true ] || options+=(--node-browser)
        "$PREREQ_PYTHON" scripts/ci/ci_prerequisite_bundle.py consume --directory "$RUNNER_TEMP/ci-prerequisite-consumer" --components "${components[@]}" "${options[@]}"
