name: Migration schema publication

on:
  workflow_dispatch:
    inputs:
      payload_blob:
        description: Git blob SHA of the hardened schema-pair ZIP created by the governed operator
        type: string
        required: true
      payload_sha256:
        description: Independently calculated SHA-256 of that ZIP
        type: string
        required: true
      manifest_sha256:
        description: Independently calculated manifest SHA-256
        type: string
        required: true
      publisher_sha:
        description: Independently admitted full main SHA
        type: string
        required: true
      mode:
        description: Fictional proof or governed staging evidence
        type: choice
        options: [fictional, staging]
        required: true
      request_id:
        description: Unique UUID hex from the governed operator
        type: string
        required: true
      admission:
        description: Fresh non-secret Root included-allowance read-back receipt
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: migration-schema-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'authorityclosers/authority-closers-platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AC_RELEASE_ARTIFACT_POOL_BYTES: ${{ vars.AC_RELEASE_ARTIFACT_POOL_BYTES }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install locked validation tooling
        run: python -m pip install --disable-pip-version-check uv==0.12.7 && uv sync --frozen
      - name: Fetch the admitted blob by SHA; validate custody, allowance, ZIP and schema-only TOC
        id: candidate
        run: >-
          uv run --frozen python scripts/ops/publish_migration_schema.py prepare-action
          --destination "$RUNNER_TEMP/schema-publication"
      - name: Publish exact pair with one-day retention
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.candidate.outputs.artifact-name }}
          path: |
            ${{ runner.temp }}/schema-publication/schema.dump
            ${{ runner.temp }}/schema-publication/manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
          overwrite: false
      - name: Record candidate identity for independent operator verification
        env:
          CANDIDATE_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          identity = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'publication-candidate.json').read_bytes())
          identity['candidate_artifact_id'] = int(os.environ['CANDIDATE_ARTIFACT_ID'])
          with pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as stream:
              stream.write('Candidate only; independent downloaded-byte proof required.\n\n')
              stream.write('```json\n' + json.dumps(identity, sort_keys=True) + '\n```\n')
          PY
