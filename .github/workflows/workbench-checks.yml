name: Workbench checks

# Owner, 20 Oct 2026: tests and emulations run on GitHub-hosted runners, not on the 4-core ac VPS that serves dev, and
# a full run finishes in under 5 minutes. `wb-ci` on ac pushes a request commit (a workbench commit plus
# `.wb-ci/request.json`) to refs/heads/wb-ci/slot-<n>, waits for this run, prints the result and deletes the branch.
# Fixed slot names keep each slot's caches warm (Actions caches are scoped to the branch name).
# No secrets, no deploys, no real databases: PostgreSQL runs in throwaway containers with local passwords, as in
# Application validation. Full layout: lint, tsc, vitest, visual and 16 Python shards = 20 jobs (the plan's limit).
# See docs/ops/WORKBENCH-CI.md.
on:
  push:
    branches:
      - "wb-ci/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: workbench-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  # Not PG_*: the local sandbox guard (development/seed.py) refuses to run when any PG* variable is set.
  POSTGRES_IMAGE: postgres@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      web: ${{ steps.plan.outputs.web }}
      py: ${{ steps.plan.outputs.py }}
      lint: ${{ steps.plan.outputs.lint }}
      visual: ${{ steps.plan.outputs.visual }}
      e2e: ${{ steps.plan.outputs.e2e }}
      migrations: ${{ steps.plan.outputs.migrations }}
      control: ${{ steps.plan.outputs.control }}
      web_matrix: ${{ steps.plan.outputs.web_matrix }}
      py_matrix: ${{ steps.plan.outputs.py_matrix }}
      py_count_a: ${{ steps.plan.outputs.py_count_a }}
      py_count_b: ${{ steps.plan.outputs.py_count_b }}
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - id: plan
        run: python3 scripts/ci/wb_checks.py plan

  lint:
    needs: plan
    if: needs.plan.outputs.lint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - if: needs.plan.outputs.web == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - if: needs.plan.outputs.web == 'true'
        name: Install locked Node dependencies
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate && pnpm install --frozen-lockfile
      - if: needs.plan.outputs.web == 'true'
        name: Restore the ESLint caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            apps/*/node_modules/.cache/eslint
            packages/typescript/*/node_modules/.cache/eslint
          key: wb-eslint-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: wb-eslint-${{ hashFiles('pnpm-lock.yaml') }}-
      - if: needs.plan.outputs.py == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - if: needs.plan.outputs.py == 'true'
        name: Install locked Python dependencies
        run: python -m pip install --disable-pip-version-check uv==0.12.7 && uv sync --frozen
      - name: Prettier, ESLint, ruff, mypy (and tsc in a full run) (${{ needs.plan.outputs.scope }})
        run: python3 scripts/ci/wb_checks.py web --task lint

  web:
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.web_matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Install locked Node dependencies
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate && pnpm install --frozen-lockfile
      - name: ${{ matrix.task }} (${{ needs.plan.outputs.scope }})
        run: python3 scripts/ci/wb_checks.py web --task ${{ matrix.task }}

  ci-prerequisites:
    # Shared by release and workbench jobs, independent of branch/identity.
    # prepare rechecks availability only after this publication lock is acquired.
    concurrency:
      group: ci-prerequisite-publication-v3
      cancel-in-progress: false
    env:
      PREREQ_PUBLICATION_OWNER: ci-prerequisite-publication-v3
    needs: plan
    if: needs.plan.outputs.py == 'true' || needs.plan.outputs.visual == 'true' || needs.plan.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      bundle: ${{ steps.bundle.outputs.bundle }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - id: bundle
        uses: ./.github/actions/ci-prerequisite-bundle

  py-tests:
    needs: [plan, ci-prerequisites]
    if: needs.plan.outputs.py == 'true'
    name: py-tests (${{ matrix.fam }} ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 17
      # Family a: test files that may need the codec/browser/native prerequisites; family b: the rest (no 60 s install).
      matrix: ${{ fromJSON(needs.plan.outputs.py_matrix) }}
    # Same databases, roles and environment as Application validation's Python test shards. PostgreSQL starts as
    # plain containers in the first step so it boots while the toolchains install.
    env:
      AC_ENVIRONMENT: test
      AC_RELEASE_ID: wb-ci-${{ github.sha }}
      AC_DATABASE_URL: postgresql+psycopg://ac_runtime:local-runtime-only@localhost:5432/ac_platform
      AC_DATABASE_MIGRATOR_URL: postgresql+psycopg://ac_migrator:local-migrator-only@localhost:5432/ac_platform
      AC_TEST_DATABASE_URL: postgresql+psycopg://ac_owner:local-owner-only@localhost:5432/ac_platform
      AC_MEDIA_DELIVERY_RENEWAL_POSTGRES_TEST_URL: postgresql+psycopg://ac_owner:local-owner-only@127.0.0.1:55432/ac_local_sandbox
      AC_OPERATIONS_POSTGRES_TEST_URL: postgresql+psycopg://ac_owner:local-owner-only@localhost:5432/ac_platform
      AC_EXTERNAL_SIDE_EFFECTS_HOLD: "true"
      AC_EMAIL_PROVIDER: fake
      AC_REQUIRE_RESTORE_INPUT_DOCKER_TEST: "1"
    steps:
      - name: Start PostgreSQL containers in the background (they pull and boot while the toolchains install)
        run: |
          ( docker run -d --name pg -e POSTGRES_DB=ac_platform -e POSTGRES_USER=ac_owner \
              -e POSTGRES_PASSWORD=local-owner-only -p 5432:5432 "$POSTGRES_IMAGE" >/dev/null
            docker run -d --name pg-recovery -e POSTGRES_DB=ac_local_sandbox -e POSTGRES_USER=ac_owner \
              -e POSTGRES_PASSWORD=local-owner-only -p 127.0.0.1:55432:5432 "$POSTGRES_IMAGE" >/dev/null
            echo done > "$RUNNER_TEMP/pg.started" ) > "$RUNNER_TEMP/pg.log" 2>&1 &
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install locked Python dependencies
        run: python -m pip install --disable-pip-version-check uv==0.12.7 && uv sync --frozen
      - name: This family's exclusion list (base exclusions plus the other family)
        if: matrix.fam != 'targeted'
        run: python3 scripts/ci/wb_checks.py py-family --fam ${{ matrix.fam }} --out "$RUNNER_TEMP/exclusions.txt"
      - name: Require cached codec, filesystem and locked browser prerequisites
        timeout-minutes: 13
        uses: ./.github/actions/ci-prerequisites
        with:
          bundle: ${{ needs.ci-prerequisites.outputs.bundle }}
          components: ${{ matrix.fam == 'b' && 'codec filesystem' || 'codec filesystem browser' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Install locked Node dependencies
        timeout-minutes: 6
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate && pnpm install --frozen-lockfile
      - name: Build verified AudioAtlas for conversation regressions
        run: uv run python -c 'from ac_platform.conversation_intelligence.signals import build_native, _native_executable; built = build_native(); assert _native_executable(None) == built.resolve()'
      - name: Provision roles and apply the PostgreSQL migration chain
        env:
          PGPASSWORD: local-owner-only
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do [ -f "$RUNNER_TEMP/pg.started" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/pg.log"
          for name in pg pg-recovery; do
            for _ in $(seq 1 60); do docker exec "$name" pg_isready -U ac_owner >/dev/null 2>&1 && break; sleep 1; done
          done
          psql --set ON_ERROR_STOP=1 --host localhost --username ac_owner --dbname ac_platform --file infra/local/postgres/init/001-roles.sql
          uv run alembic upgrade head && uv run alembic check
      - name: Run Python tests (family ${{ matrix.fam }}, shard ${{ matrix.shard }} of ${{ matrix.count }})
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/python-test-shard-${{ matrix.shard }}"
          mkdir -p "$out"
          if [ "${{ matrix.fam }}" = targeted ]; then
            mapfile -t tests < <(python3 -c 'import json; print("\n".join(json.load(open(".wb-ci/request.json"))["py_tests"]))')
            uv run pytest -q --junitxml "$out/junit.xml" --basetemp "${RUNNER_TEMP}/wb-python-basetemp" "${tests[@]}"
          else
            uv run python scripts/ci/python_test_shard.py run \
              --root "${GITHUB_WORKSPACE}" \
              --duration-file scripts/ci/wb-python-durations.json \
              --shard-index "${{ matrix.shard }}" \
              --shard-count "${{ matrix.count }}" \
              --exclude-file "$RUNNER_TEMP/exclusions.txt" \
              --manifest "$out/manifest.json" \
              --junitxml "$out/junit.xml" \
              --basetemp "${RUNNER_TEMP}/wb-python-basetemp-${{ matrix.shard }}"
          fi
      # The summary needs the manifest to prove complete coverage. Green shards
      # retain only this small summary; full reports are useful on failure.
      - name: Keep only the green shard's coverage summary
        if: success() && matrix.fam != 'targeted'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wb-py-${{ matrix.fam }}-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/python-test-shard-${{ matrix.shard }}/manifest.json
          if-no-files-found: error
          retention-days: 1
      - name: Keep the failed shard's manifest and JUnit report
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wb-py-${{ matrix.fam }}-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/python-test-shard-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 1

  visual:
    needs: [plan, ci-prerequisites]
    if: needs.plan.outputs.visual == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Install locked Node dependencies
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate && pnpm install --frozen-lockfile
      - name: Require cached locked Node browser
        timeout-minutes: 13
        uses: ./.github/actions/ci-prerequisites
        with:
          bundle: ${{ needs.ci-prerequisites.outputs.bundle }}
          components: browser
          python: python3
          node-browser: "true"
      - name: Screenshots at 390 and 1440, light and dark, fictional data only (${{ needs.plan.outputs.scope }})
        timeout-minutes: 10
        run: node scripts/ci/wb_screens.mjs "$RUNNER_TEMP/wb-screens" .wb-ci/request.json
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wb-screens
          path: |
            ${{ runner.temp }}/wb-screens/*.png
            ${{ runner.temp }}/wb-screens/receipt.json
          if-no-files-found: warn
          retention-days: 1

  e2e:
    # Opt-in (`wb-ci --e2e`), never part of --full: the release's Sales Xray browser proofs from application.yml
    # (static export journeys and the production-standalone acquisition journey), so navigation or label drift shows
    # up before a release cut instead of 35 minutes into one.
    needs: [plan, ci-prerequisites]
    if: needs.plan.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: ac_platform
          POSTGRES_USER: ac_owner
          POSTGRES_PASSWORD: local-owner-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ac_owner -d ac_platform"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      AC_ENVIRONMENT: test
      AC_RELEASE_ID: wb-ci-${{ github.sha }}
      AC_DATABASE_URL: postgresql+psycopg://ac_runtime:local-runtime-only@localhost:5432/ac_platform
      AC_DATABASE_MIGRATOR_URL: postgresql+psycopg://ac_migrator:local-migrator-only@localhost:5432/ac_platform
      AC_TEST_DATABASE_URL: postgresql+psycopg://ac_owner:local-owner-only@localhost:5432/ac_platform
      AC_CONVERSATION_POSTGRES_TEST_URL: postgresql+psycopg://ac_owner:local-owner-only@localhost:5432/ac_platform
      AC_EXTERNAL_SIDE_EFFECTS_HOLD: "true"
      AC_EMAIL_PROVIDER: fake
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check uv==0.12.7 && pnpm install --frozen-lockfile && uv sync --frozen
      - name: Require codec and locked browser
        timeout-minutes: 13
        uses: ./.github/actions/ci-prerequisites
        with:
          bundle: ${{ needs.ci-prerequisites.outputs.bundle }}
          components: codec browser
      - name: Build verified AudioAtlas
        run: uv run --frozen python -c 'from ac_platform.conversation_intelligence.signals import build_native, _native_executable; built = build_native(); assert _native_executable(None) == built.resolve()'
      - name: Provision roles, the migration chain and the acquisition database
        env:
          PGPASSWORD: local-owner-only
        run: |
          set -euo pipefail
          psql --set ON_ERROR_STOP=1 --host localhost --username ac_owner --dbname ac_platform --file infra/local/postgres/init/001-roles.sql
          uv run alembic upgrade head
          psql --set ON_ERROR_STOP=1 --host localhost --username ac_owner --dbname ac_platform -c 'CREATE DATABASE ac_sales_xray_browser'
      - name: Build Sales Xray static preview
        env:
          AC_SALES_XRAY_STATIC_PREVIEW: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm --filter @ac/sales-xray-web build
      - name: Sales Xray static export browser journeys (as application.yml validate-python-gates)
        timeout-minutes: 8
        run: >-
          uv run --frozen pytest
          tests/e2e/test_sales_xray_standalone_browser.py
          tests/e2e/test_sales_xray_report_browser.py
          -r s
          --junitxml="${{ runner.temp }}/sales-xray-static-browser.xml"
      - name: Build Sales Xray production standalone
        env:
          AC_CONVERSATION_API_ORIGIN: http://127.0.0.1:18116
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm --filter @ac/sales-xray-web build
      - name: Sales Xray acquisition browser journey (as application.yml validate-sales-xray-acquisition-browser)
        timeout-minutes: 20
        env:
          AC_TEST_DATABASE_URL: postgresql+psycopg://ac_owner:local-owner-only@127.0.0.1:5432/ac_sales_xray_browser
          AC_CONVERSATION_POSTGRES_TEST_URL: postgresql+psycopg://ac_owner:local-owner-only@127.0.0.1:5432/ac_sales_xray_browser
        run: >-
          uv run --frozen python
          scripts/ci/verify_sales_xray_acquisition_browser.py
          --evidence-dir "${{ runner.temp }}/sales-xray-acquisition-browser"
      - name: Keep the browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wb-e2e-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 1
          path: |
            ${{ runner.temp }}/sales-xray-static-browser.xml
            ${{ runner.temp }}/sales-xray-acquisition-browser/sales-xray-acquisition-browser-receipt.json

  # v0.86 root causes (owner, 24 Oct 2026): migration commits learn here, at commit time, what the release PR's
  # migration-safety would say. Released migrations must be unchanged; the recovery policy and the gate's own
  # fixtures must pass; the new revisions are rehearsed (upgrade, downgrade, schema comparison, re-upgrade) on a
  # baseline the migrations build. The release PR still rehearses on staging's export, which is published by hand
  # and kept for one day, so wb-ci does not depend on it.
  migrations:
    needs: plan
    if: needs.plan.outputs.migrations == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch main, where released migrations live
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install locked migration tooling
        run: python -m pip install --disable-pip-version-check uv==0.12.7 && uv sync --frozen
      - name: Released migrations are history
        run: uv run python scripts/ci/released_migrations.py --base origin/main
      - name: Recovery policy, released-history check and gate fixtures (fictional disposable PostgreSQL)
        env:
          AC_REQUIRE_SCHEMA_GATE_DOCKER_TEST: "1"
        run: |
          set -euo pipefail
          uv run pytest -q tests/infra/test_released_migrations.py tests/infra/test_migration_schema_gate.py
          uv run pytest -q tests/infra/test_restore_drill.py -k "forward_only_recovery_policy or frozen_history"
      - name: Rehearse the new revisions on a baseline built from the migrations
        run: uv run python scripts/ci/migration_schema_gate.py --base-ref origin/main --baseline-from-migrations

  # The release PR's validate-control-plane job (shellcheck, bash -n, CRLF, pinned images, the infra tests and the
  # PowerShell parse), here when shell, PowerShell, systemd or infra files change.
  control-plane:
    needs: plan
    if: needs.plan.outputs.control == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AC_REQUIRE_HISTORICAL_BACKUP_CONTROLLER_TEST: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the exact historical backup controller
        run: git cat-file -e '35c658bd028b4fc3a7c048ab72dae700cd7682d6:infra/application/scripts/restore-drill.py'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install locked Python dependencies
        run: python -m pip install --disable-pip-version-check uv==0.12.7 && uv sync --frozen
      - name: Install checksum-pinned ShellCheck
        shell: bash
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_LINUX_X64_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          curl --fail --silent --show-error --location \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            --output "${archive}"
          printf '%s  %s\n' "${SHELLCHECK_LINUX_X64_SHA256}" "${archive}" | sha256sum --check --strict
          tar --extract --xz --file "${archive}" --directory "${RUNNER_TEMP}"
          printf '%s\n' "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}" >> "${GITHUB_PATH}"
      - name: Validate the repository control plane
        run: bash scripts/validate-control-plane.sh

  summary:
    needs: [plan, ci-prerequisites, lint, web, py-tests, visual, e2e, migrations, control-plane]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      # Release pipeline (owner, 24 Oct 2026): 17 one-day shard manifests per run, at ~85 runs a day, were a quarter
      # of the 2 GB artifact pool and expired about once a minute, so Root's complete-inventory read kept seeing the
      # count move (AUT-2185, AUT-2214). One artifact per run now; the shard folders keep their names inside it.
      - name: Fold this attempt's shard manifests into one artifact
        if: needs.py-tests.result != 'skipped' && !contains(needs.plan.outputs.py_matrix, 'targeted')
        continue-on-error: true
        uses: actions/upload-artifact/merge@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wb-py-shards-${{ github.sha }}-${{ github.run_attempt }}
          pattern: wb-py-[ab]-${{ github.sha }}-${{ github.run_attempt }}-*
          separate-directories: true
          delete-merged: true
          retention-days: 1
      - name: Download Python shard evidence
        if: needs.py-tests.result != 'skipped' && !contains(needs.plan.outputs.py_matrix, 'targeted')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: wb-py-*-${{ github.sha }}-*
          path: ${{ runner.temp }}/wb-py
          merge-multiple: false
      - name: Verify every Python shard reported, family by family (the families partition the tests)
        id: verify
        if: needs.py-tests.result != 'skipped' && !contains(needs.plan.outputs.py_matrix, 'targeted')
        env:
          COUNT_A: ${{ needs.plan.outputs.py_count_a }}
          COUNT_B: ${{ needs.plan.outputs.py_count_b }}
        run: |
          set -euo pipefail
          for fam in a b; do
            count=COUNT_${fam^^}
            dir="$RUNNER_TEMP/verify-$fam"
            mkdir -p "$dir"
            # Folded shards sit one level down (wb-py-shards-*/); a fold that failed leaves them at the top.
            for src in "$RUNNER_TEMP"/wb-py/wb-py-"$fam"-* "$RUNNER_TEMP"/wb-py/wb-py-shards-*/wb-py-"$fam"-*; do
              [ -d "$src" ] && mv "$src" "$dir/python-test-shard-${src##*/wb-py-$fam-}"
            done
            python3 scripts/ci/wb_checks.py py-family --fam "$fam" --out "$RUNNER_TEMP/exclusions-$fam.txt"
            python3 scripts/ci/python_test_shard.py verify \
              --root "${GITHUB_WORKSPACE}" \
              --duration-file scripts/ci/wb-python-durations.json \
              --shard-count "${!count}" \
              --exclude-file "$RUNNER_TEMP/exclusions-$fam.txt" \
              --manifest-dir "$dir" \
              --sha "${{ github.sha }}" \
              --run-attempt "${{ github.run_attempt }}"
          done
      - name: Results and artifact links
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: python3 scripts/ci/wb_checks.py summary
