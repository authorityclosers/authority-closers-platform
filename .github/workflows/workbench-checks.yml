name: Workbench checks

# Owner, 20 Oct 2026: tests and emulations run on GitHub-hosted runners, not on the 4-core ac VPS that serves dev.
# `wb-ci` on ac pushes a request commit (a workbench commit plus `.wb-ci/request.json`) to refs/heads/wb-ci/<sha>-<rand>,
# waits for this run, prints the result and deletes the branch. No secrets, no deploys, no real databases: PostgreSQL is
# a service container with throwaway local passwords, as in Application validation. See docs/ops/WORKBENCH-CI.md.
on:
  push:
    branches:
      - "wb-ci/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: workbench-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      web: ${{ steps.plan.outputs.web }}
      py: ${{ steps.plan.outputs.py }}
      visual: ${{ steps.plan.outputs.visual }}
      shards: ${{ steps.plan.outputs.shards }}
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - id: plan
        run: python3 scripts/ci/wb_checks.py plan

  web:
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile
      - name: Prettier, ESLint, tsc and Vitest (${{ needs.plan.outputs.scope }})
        run: python3 scripts/ci/wb_checks.py web

  py-static:
    needs: plan
    if: needs.plan.outputs.py == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.7
      - name: Install locked Python dependencies
        run: uv sync --frozen
      - name: Ruff format, ruff check and mypy (${{ needs.plan.outputs.scope }})
        run: python3 scripts/ci/wb_checks.py py-static

  py-tests:
    needs: plan
    if: needs.plan.outputs.py == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    # Same services, roles and environment as Application validation's Python test shards.
    services:
      postgres:
        image: postgres@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: ac_platform
          POSTGRES_USER: ac_owner
          POSTGRES_PASSWORD: local-owner-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ac_owner -d ac_platform"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      postgres-recovery-tests:
        image: postgres@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: ac_local_sandbox
          POSTGRES_USER: ac_owner
          POSTGRES_PASSWORD: local-owner-only
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U ac_owner -d ac_local_sandbox"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      AC_ENVIRONMENT: test
      AC_RELEASE_ID: wb-ci-${{ github.sha }}
      AC_DATABASE_URL: postgresql+psycopg://ac_runtime:local-runtime-only@localhost:5432/ac_platform
      AC_DATABASE_MIGRATOR_URL: postgresql+psycopg://ac_migrator:local-migrator-only@localhost:5432/ac_platform
      AC_TEST_DATABASE_URL: postgresql+psycopg://ac_owner:local-owner-only@localhost:5432/ac_platform
      AC_MEDIA_DELIVERY_RENEWAL_POSTGRES_TEST_URL: postgresql+psycopg://ac_owner:local-owner-only@127.0.0.1:55432/ac_local_sandbox
      AC_OPERATIONS_POSTGRES_TEST_URL: postgresql+psycopg://ac_owner:local-owner-only@localhost:5432/ac_platform
      AC_EXTERNAL_SIDE_EFFECTS_HOLD: "true"
      AC_EMAIL_PROVIDER: fake
      AC_REQUIRE_RESTORE_INPUT_DOCKER_TEST: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.7
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile && uv sync --frozen
      - name: Require codec, filesystem and locked browser prerequisites
        timeout-minutes: 13
        run: uv run --frozen python scripts/ci/ci_prerequisites.py codec filesystem browser
      - name: Build verified AudioAtlas for conversation regressions
        run: |
          set -euo pipefail
          uv run python -c 'from ac_platform.conversation_intelligence.signals import build_native, _native_executable; built = build_native(); assert _native_executable(None) == built.resolve()'
      - name: Provision least-privilege database roles
        env:
          PGPASSWORD: local-owner-only
        run: >-
          psql --set ON_ERROR_STOP=1
          --host localhost
          --username ac_owner
          --dbname ac_platform
          --file infra/local/postgres/init/001-roles.sql
      - name: Apply and verify PostgreSQL migration chain
        run: uv run alembic upgrade head && uv run alembic check
      - name: Run Python tests (shard ${{ matrix.shard }})
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/wb-python-${{ matrix.shard }}"
          mkdir -p "$out"
          if [ "${{ matrix.shard }}" = targeted ]; then
            mapfile -t tests < <(python3 -c 'import json; print("\n".join(json.load(open(".wb-ci/request.json"))["py_tests"]))')
            uv run pytest -q --junitxml "$out/junit.xml" --basetemp "${RUNNER_TEMP}/wb-python-basetemp" "${tests[@]}"
          else
            uv run python scripts/ci/python_test_shard.py run \
              --root "${GITHUB_WORKSPACE}" \
              --shard-index "${{ matrix.shard }}" \
              --shard-count 4 \
              --exclude-file scripts/ci/python-test-exclusions.txt \
              --manifest "$out/manifest.json" \
              --junitxml "$out/junit.xml" \
              --basetemp "${RUNNER_TEMP}/wb-python-basetemp-${{ matrix.shard }}"
          fi
      - name: Keep the shard's JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wb-python-${{ matrix.shard }}
          path: ${{ runner.temp }}/wb-python-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 3

  visual:
    needs: plan
    if: needs.plan.outputs.visual == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Install locked tools
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        timeout-minutes: 4
        run: pnpm exec playwright install --with-deps chromium --only-shell
      - name: Screenshots at 390 and 1440, light and dark, fictional data only
        timeout-minutes: 16
        run: node scripts/ci/wb_screens.mjs "$RUNNER_TEMP/wb-screens" .wb-ci/request.json
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wb-screens
          path: |
            ${{ runner.temp }}/wb-screens/*.png
            ${{ runner.temp }}/wb-screens/receipt.json
          if-no-files-found: warn
          retention-days: 3

  summary:
    needs: [plan, web, py-static, py-tests, visual]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Results and artifact links
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/wb_checks.py summary
