name: Sales Xray visual advisory

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sales-xray-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Deliberately advisory, including tool/setup failures. No status or PR writes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install locked tools
        timeout-minutes: 2
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check pillow==12.3.0
      - name: Select touched fictional screens plus shell
        env:
          VISUAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci/sales_xray_visual_report.py selection --output "$RUNNER_TEMP/visual-selection.json"
      - name: Read last successful visual main artifact with green Application validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/sales_xray_visual_report.py baseline --output "$RUNNER_TEMP/visual-baseline"
      - name: Install Playwright 1.58.2 Chromium
        timeout-minutes: 2
        run: pnpm exec playwright install --with-deps chromium --only-shell
      - name: Check focused visual-helper regressions
        run: |
          node --test scripts/ci/sales_xray_visual.test.mjs
          python -m unittest discover -s scripts/ci -p 'sales_xray_visual_report_test.py'
          pnpm exec prettier --check .github/workflows/sales-xray-visual.yml scripts/ci/sales_xray_visual.mjs scripts/ci/sales_xray_visual.test.mjs
      - name: Render with frozen time and no external/API requests
        timeout-minutes: 5
        run: node scripts/ci/sales_xray_visual.mjs "$RUNNER_TEMP/visual-output" "$RUNNER_TEMP/visual-selection.json"
      - name: Build contact sheet, pixel diffs and count-only contract
        if: always()
        env:
          VISUAL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/ci/sales_xray_visual_report.py report --output "$RUNNER_TEMP/visual-output" --baseline-dir "$RUNNER_TEMP/visual-baseline"
      - name: Upload bounded advisory evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sales-xray-visual-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/visual-output/*.png
            ${{ runner.temp }}/visual-output/receipt.json
            ${{ runner.temp }}/visual-output/report.md
          if-no-files-found: warn
          retention-days: 3
      - name: Link review evidence
        if: always() && steps.evidence.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: printf '\n[Contact sheet, screenshots, diffs and receipt](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
