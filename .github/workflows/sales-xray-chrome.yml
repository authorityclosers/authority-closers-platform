name: Sales Xray Chrome extension

# Tests and zips the Sales Xray Chrome extension (owner order, 16 Oct 2026) on
# GitHub-hosted Linux runners. Every run keeps the zip as an artifact; a main
# build also replaces the files of the "sales-xray-chrome-latest" release. The
# extension holds no keys or tokens, so publishing its zip exposes nothing.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/sales-xray-chrome/**
      - .github/workflows/sales-xray-chrome.yml

permissions:
  contents: read

concurrency:
  group: sales-xray-chrome-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zip:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/sales-xray-chrome
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Test
        run: node --test test/*.test.js
      - name: Stamp the version
        run: node -e 'const fs = require("fs"); const m = JSON.parse(fs.readFileSync("manifest.json", "utf8")); m.version = "0.1.${{ github.run_number }}"; fs.writeFileSync("manifest.json", JSON.stringify(m, null, 2));'
      - name: Zip
        run: |
          mkdir -p dist
          zip -r -X "dist/sales-xray-chrome-0.1.${{ github.run_number }}.zip" \
            manifest.json worker.js lead-link.js popup.html popup.js popup.css whatsapp.js icons
          sha256sum dist/*.zip
      - name: Keep the zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sales-xray-chrome-${{ github.run_number }}
          path: apps/sales-xray-chrome/dist/*.zip
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: zip
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Get the zip
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sales-xray-chrome-${{ github.run_number }}
          path: dist
      - name: Replace the published release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.1.${{ github.run_number }}
        run: |
          cp "sales-xray-chrome-$VERSION.zip" sales-xray-chrome.zip
          sha256sum sales-xray-chrome.zip > SHA256SUMS.txt
          gh release delete sales-xray-chrome-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create sales-xray-chrome-latest \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Sales Xray for Chrome $VERSION" \
            --notes "Built from $GITHUB_SHA. Unzip, open chrome://extensions, switch on Developer mode, then Load unpacked and pick the folder." \
            sales-xray-chrome.zip SHA256SUMS.txt
