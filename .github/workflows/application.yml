name: Application validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  academy-capacity-simulation:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate the published Academy capacity model
        shell: pwsh
        run: ./scripts/Test-AcademyCapacitySimulation.ps1

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: ac_platform
          POSTGRES_USER: ac_owner
          POSTGRES_PASSWORD: local-owner-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ac_owner -d ac_platform"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      AC_ENVIRONMENT: test
      AC_RELEASE_ID: ci-${{ github.sha }}
      AC_DATABASE_URL: postgresql+psycopg://ac_runtime:local-runtime-only@localhost:5432/ac_platform
      AC_DATABASE_MIGRATOR_URL: postgresql+psycopg://ac_migrator:local-migrator-only@localhost:5432/ac_platform
      # Fresh-schema PostgreSQL acceptance suites require a disposable database
      # owner so they can create and drop their isolated search paths. The CI
      # service itself is ephemeral; production never exposes this credential.
      AC_TEST_DATABASE_URL: postgresql+psycopg://ac_owner:local-owner-only@localhost:5432/ac_platform
      AC_OPERATIONS_POSTGRES_TEST_URL: postgresql+psycopg://ac_owner:local-owner-only@localhost:5432/ac_platform
      AC_EXTERNAL_SIDE_EFFECTS_HOLD: "true"
      AC_EMAIL_PROVIDER: fake
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.7
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile && uv sync --frozen
      - name: Provision least-privilege database roles
        env:
          PGPASSWORD: local-owner-only
        run: >-
          psql --set ON_ERROR_STOP=1
          --host localhost
          --username ac_owner
          --dbname ac_platform
          --file infra/local/postgres/init/001-roles.sql
      - name: Apply and verify PostgreSQL migration chain
        run: uv run alembic upgrade head && uv run alembic check
      - name: Prove the backup role can dump the migrated schema
        env:
          PGPASSWORD: local-backup-only
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          backup_file="$(mktemp "${RUNNER_TEMP}/ac-backup-role-proof.XXXXXX.dump")"
          trap 'rm -f -- "$backup_file"' EXIT
          umask 077
          docker exec --env PGPASSWORD="$PGPASSWORD" "$POSTGRES_SERVICE_ID" \
            pg_dump --username ac_backup --dbname ac_platform --format=custom --create \
            > "$backup_file"
          docker exec --interactive "$POSTGRES_SERVICE_ID" pg_restore --list \
            < "$backup_file" > /dev/null
      - name: Verify database privilege split
        env:
          PGPASSWORD: local-owner-only
        run: |
          psql --set ON_ERROR_STOP=1 --host localhost --username ac_owner --dbname ac_platform <<'SQL'
          DO $$
          BEGIN
            IF has_schema_privilege('ac_runtime', 'public', 'CREATE') THEN
              RAISE EXCEPTION 'runtime role may create schema objects';
            END IF;
            IF has_database_privilege('ac_runtime', current_database(), 'CREATE')
               OR has_database_privilege('ac_runtime', current_database(), 'TEMP') THEN
              RAISE EXCEPTION 'runtime role may create database or temporary objects';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM pg_roles
              WHERE rolname = 'ac_runtime'
                AND (rolsuper OR rolcreatedb OR rolcreaterole OR rolinherit
                     OR rolreplication OR rolbypassrls)
            ) THEN
              RAISE EXCEPTION 'runtime role has an elevated role attribute';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM pg_tables
              WHERE schemaname = 'public' AND tableowner <> 'ac_migrator'
            ) THEN
              RAISE EXCEPTION 'a migrated table is not owned by the migrator role';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM pg_class relation
              JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace
              JOIN pg_roles owner_role ON owner_role.oid = relation.relowner
              WHERE namespace.nspname = 'public' AND owner_role.rolname = 'ac_runtime'
            ) OR EXISTS (
              SELECT 1
              FROM pg_proc procedure
              JOIN pg_namespace namespace ON namespace.oid = procedure.pronamespace
              JOIN pg_roles owner_role ON owner_role.oid = procedure.proowner
              WHERE namespace.nspname = 'public' AND owner_role.rolname = 'ac_runtime'
            ) THEN
              RAISE EXCEPTION 'runtime role owns a migrated relation or function';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM pg_tables
              WHERE schemaname = 'public'
                AND (
                  has_table_privilege('ac_runtime', format('%I.%I', schemaname, tablename), 'TRUNCATE')
                  OR has_table_privilege('ac_runtime', format('%I.%I', schemaname, tablename), 'REFERENCES')
                  OR has_table_privilege('ac_runtime', format('%I.%I', schemaname, tablename), 'TRIGGER')
                )
            ) THEN
              RAISE EXCEPTION 'runtime role has a forbidden structural table privilege';
            END IF;
          END
          $$;
          SQL
      - name: Prove staging seed PostgreSQL serialization
        env:
          AC_REQUIRE_STAGING_SEED_POSTGRES_TEST: "1"
        run: uv run pytest tests/integration/test_staging_seed_postgresql.py
      - name: Prove catalog publication locking and runtime database boundary
        env:
          AC_REQUIRE_CATALOG_POSTGRES_TEST: "1"
          AC_REQUIRE_DATABASE_RUNTIME_PRIVILEGES_TEST: "1"
          AC_REQUIRE_LEARNING_HTTP_POSTGRES_TEST: "1"
        run: >-
          uv run pytest
          tests/integration/test_catalog_publication_concurrency_postgresql.py
          tests/integration/test_catalog_publication_migration_postgresql.py
          tests/integration/test_database_runtime_privileges_postgresql.py
          tests/integration/test_learning_http_postgresql.py
      - name: Validate application
        env:
          AC_REQUIRE_RESTORE_INPUT_DOCKER_TEST: "1"
        run: pnpm validate

  package-release-images:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: application-release-packaging
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      packages: write
    env:
      API_IMAGE: ghcr.io/authorityclosers/authority-closers-api:${{ github.sha }}
      LEARNER_IMAGE: ghcr.io/authorityclosers/authority-closers-learner-web:${{ github.sha }}
      ADMIN_IMAGE: ghcr.io/authorityclosers/authority-closers-admin-web:${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/application/Dockerfile.python
          target: runtime
          platforms: linux/amd64
          load: true
          tags: ${{ env.API_IMAGE }}
          build-args: |
            AC_RELEASE_ID=${{ github.sha }}
          cache-from: type=gha,scope=application-api
          cache-to: type=gha,mode=max,scope=application-api
      - name: Build learner release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/application/Dockerfile.web
          target: learner
          platforms: linux/amd64
          load: true
          tags: ${{ env.LEARNER_IMAGE }}
          cache-from: type=gha,scope=application-web
          cache-to: type=gha,mode=max,scope=application-web
      - name: Build admin release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/application/Dockerfile.web
          target: admin
          platforms: linux/amd64
          load: true
          tags: ${{ env.ADMIN_IMAGE }}
          cache-from: type=gha,scope=application-web
          cache-to: type=gha,mode=max,scope=application-web
      - name: Publish immutable SHA tags
        run: |
          set -euo pipefail
          publish_once() {
            image="$1"
            built_id="$(docker image inspect --format '{{.Id}}' "$image")"
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              docker pull "$image"
              published_id="$(docker image inspect --format '{{.Id}}' "$image")"
              if [ "$published_id" != "$built_id" ]; then
                printf 'Refusing to overwrite immutable release tag %s\n' "$image" >&2
                exit 1
              fi
            else
              docker push "$image"
              docker pull "$image"
            fi
          }
          publish_once "$API_IMAGE"
          publish_once "$LEARNER_IMAGE"
          publish_once "$ADMIN_IMAGE"
      - name: Create transport archives and reviewed manifest
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/ac-application-${GITHUB_SHA}"
          transport_tar="$RUNNER_TEMP/ac-application-${GITHUB_SHA}.tar"
          transport_index="$RUNNER_TEMP/ac-application-${GITHUB_SHA}-index.json"
          mkdir -p "$artifact_dir"
          # One archive deduplicates the shared Node image layers used by the
          # learner and admin runtimes. This keeps the one-day transport
          # artifact inside the GitHub Free storage allowance.
          docker save --output "$transport_tar" \
            "$API_IMAGE" "$LEARNER_IMAGE" "$ADMIN_IMAGE"
          tar --extract --to-stdout --file "$transport_tar" index.json > "$transport_index"

          transport_digest_for() {
            image="$1"
            mapfile -t matches < <(
              jq --raw-output --arg image "$image" \
                '.manifests[] | select(.annotations["io.containerd.image.name"] == $image) | .digest' \
                "$transport_index"
            )
            if [ "${#matches[@]}" -ne 1 ] || ! [[ "${matches[0]}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              printf 'OCI transport index does not contain exactly one manifest for %s\n' "$image" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }

          verify_transport_config() {
            transport_digest="$1"
            expected_config_digest="$2"
            manifest_path="blobs/sha256/${transport_digest#sha256:}"
            actual_transport_digest="sha256:$(
              tar --extract --to-stdout --file "$transport_tar" "$manifest_path" | sha256sum | cut -d' ' -f1
            )"
            [ "$actual_transport_digest" = "$transport_digest" ] || {
              printf 'OCI transport manifest digest verification failed: %s\n' "$transport_digest" >&2
              exit 1
            }
            transported_config_digest="$(
              tar --extract --to-stdout --file "$transport_tar" "$manifest_path" | jq --raw-output '.config.digest'
            )"
            [ "$transported_config_digest" = "$expected_config_digest" ] || {
              printf 'OCI transport manifest does not reference the reviewed image config.\n' >&2
              exit 1
            }
          }

          api_id="$(docker image inspect --format '{{.Id}}' "$API_IMAGE")"
          learner_id="$(docker image inspect --format '{{.Id}}' "$LEARNER_IMAGE")"
          admin_id="$(docker image inspect --format '{{.Id}}' "$ADMIN_IMAGE")"
          api_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$API_IMAGE")"
          learner_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$LEARNER_IMAGE")"
          admin_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$ADMIN_IMAGE")"
          api_release_id="$(
            docker run --rm --network none --entrypoint /bin/sh "$api_id" \
              -c 'cat /app/.ac-release-id'
          )"
          [ "$api_release_id" = "$GITHUB_SHA" ] || {
            printf 'API image release marker does not match the workflow commit.\n' >&2
            exit 1
          }
          mapfile -t migration_heads < <(
            docker run --rm --network none --entrypoint alembic "$api_id" heads \
              | awk '$2 == "(head)" { print $1 }'
          )
          if [ "${#migration_heads[@]}" -ne 1 ] \
            || ! [[ "${migration_heads[0]}" =~ ^[0-9]{8}_[0-9]{4}$ ]]; then
            printf 'API image must contain exactly one valid Alembic head.\n' >&2
            exit 1
          fi
          migration_head="${migration_heads[0]}"
          api_transport_digest="$(transport_digest_for "$API_IMAGE")"
          learner_transport_digest="$(transport_digest_for "$LEARNER_IMAGE")"
          admin_transport_digest="$(transport_digest_for "$ADMIN_IMAGE")"
          verify_transport_config "$api_transport_digest" "$api_id"
          verify_transport_config "$learner_transport_digest" "$learner_id"
          verify_transport_config "$admin_transport_digest" "$admin_id"
          gzip -9 < "$transport_tar" > "$artifact_dir/application-images.tar.gz"
          {
            printf 'AC_RELEASE_ID=%s\n' "$GITHUB_SHA"
            # The foundation uses Docker's containerd image store, where an
            # imported OCI image is addressed by its manifest digest. The
            # config ID remains independently bound by verify_transport_config.
            printf 'AC_API_IMAGE=%s\n' "$api_transport_digest"
            printf 'AC_API_REGISTRY_DIGEST=%s\n' "$api_digest"
            printf 'AC_API_TRANSPORT_DIGEST=%s\n' "$api_transport_digest"
            printf 'AC_LEARNER_IMAGE=%s\n' "$learner_transport_digest"
            printf 'AC_LEARNER_REGISTRY_DIGEST=%s\n' "$learner_digest"
            printf 'AC_LEARNER_TRANSPORT_DIGEST=%s\n' "$learner_transport_digest"
            printf 'AC_MIGRATION_HEAD=%s\n' "$migration_head"
            printf 'AC_ADMIN_IMAGE=%s\n' "$admin_transport_digest"
            printf 'AC_ADMIN_REGISTRY_DIGEST=%s\n' "$admin_digest"
            printf 'AC_ADMIN_TRANSPORT_DIGEST=%s\n' "$admin_transport_digest"
          } > "$artifact_dir/release-images.env"
          (
            cd "$artifact_dir"
            sha256sum application-images.tar.gz release-images.env > SHA256SUMS
          )
          python infra/application/scripts/prepare-release-inputs.py \
            verify-bundle "$artifact_dir" "$GITHUB_SHA" > /dev/null
      - name: Admit release artifact under the pooled ceiling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/ac-application-${GITHUB_SHA}"
          candidate_bytes="$(du --bytes --summarize "$artifact_dir" | cut -f1)"
          max_artifact_bytes=450000000
          max_artifact_pool_bytes=450000000
          if [ "$candidate_bytes" -gt "$max_artifact_bytes" ]; then
            printf 'Release artifact is %s bytes; refusing upload above %s bytes.\n' \
              "$candidate_bytes" "$max_artifact_bytes" >&2
            exit 1
          fi

          list_repository_artifacts() {
            gh api --paginate \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              | jq --slurp '[.[].artifacts[]]'
          }

          artifacts_before="$RUNNER_TEMP/repository-artifacts-before.json"
          list_repository_artifacts > "$artifacts_before"
          retained_bytes="$(jq '[.[].size_in_bytes] | add // 0' "$artifacts_before")"
          [[ "$retained_bytes" =~ ^[0-9]+$ ]] || {
            printf 'Repository artifact usage could not be proven.\n' >&2
            exit 1
          }
          projected_artifact_pool_bytes=$((retained_bytes + candidate_bytes))
          if [ "$projected_artifact_pool_bytes" -gt "$max_artifact_pool_bytes" ]; then
            printf 'Projected repository artifact pool is %s bytes; refusing upload above %s bytes.\n' \
              "$projected_artifact_pool_bytes" "$max_artifact_pool_bytes" >&2
            exit 1
          fi
          printf 'Release artifact is %s bytes; projected repository pool is %s bytes (ceiling %s).\n' \
            "$candidate_bytes" "$projected_artifact_pool_bytes" "$max_artifact_pool_bytes"
      - name: Upload reviewed release bundle
        id: upload_release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ac-application-${{ github.sha }}
          path: ${{ runner.temp }}/ac-application-${{ github.sha }}
          if-no-files-found: error
          # The transport bundle is copied into the immutable VPS artifact
          # store. Keep GitHub Actions storage below the Free-plan allowance.
          retention-days: 1
      - name: Reclaim superseded release artifacts after verified upload
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOADED_ARTIFACT_ID: ${{ steps.upload_release.outputs.artifact-id }}
        run: |
          set -euo pipefail
          max_artifact_pool_bytes=450000000
          current_name="ac-application-${GITHUB_SHA}"
          current_artifact_id="$UPLOADED_ARTIFACT_ID"
          [[ "$current_artifact_id" =~ ^[0-9]+$ ]] || {
            printf 'Uploaded release artifact identity is malformed.\n' >&2
            exit 1
          }

          list_repository_artifacts() {
            gh api --paginate \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              | jq --slurp '[.[].artifacts[]]'
          }

          uploaded_artifact="$RUNNER_TEMP/uploaded-release-artifact.json"
          uploaded_artifact_proven=0
          for _attempt in 1 2 3 4 5; do
            if gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${current_artifact_id}" \
              > "$uploaded_artifact" \
              && jq --exit-status \
                --arg current "$current_name" \
                --argjson artifact_id "$current_artifact_id" \
                --argjson run_id "$GITHUB_RUN_ID" \
                '.id == $artifact_id
                 and .name == $current
                 and .workflow_run.id == $run_id
                 and .expired == false
                 and .size_in_bytes > 0' \
                "$uploaded_artifact" > /dev/null; then
              uploaded_artifact_proven=1
              break
            fi
            sleep 2
          done
          [[ "$uploaded_artifact_proven" == 1 ]] || {
            printf 'Uploaded release artifact could not be proven for this workflow run.\n' >&2
            exit 1
          }

          artifacts_after_upload="$RUNNER_TEMP/repository-artifacts-after-upload.json"
          list_repository_artifacts > "$artifacts_after_upload"
          mapfile -t superseded_artifact_ids < <(
            jq --raw-output --argjson current_id "$current_artifact_id" \
              '.[]
               | select((.name // "") | test("^ac-application-[0-9a-f]{40}$"))
               | select(.id != $current_id)
               | .id' \
              "$artifacts_after_upload"
          )
          for artifact_id in "${superseded_artifact_ids[@]}"; do
            [[ "$artifact_id" =~ ^[0-9]+$ ]] || {
              printf 'Refusing malformed superseded release artifact identity.\n' >&2
              exit 1
            }
            gh api --method DELETE \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

          artifacts_final="$RUNNER_TEMP/repository-artifacts-final.json"
          list_repository_artifacts > "$artifacts_final"
          final_bytes="$(jq '[.[].size_in_bytes] | add // 0' "$artifacts_final")"
          final_current_count="$(
            jq --argjson current_id "$current_artifact_id" \
              '[.[] | select(.id == $current_id)] | length' "$artifacts_final"
          )"
          [[ "$final_bytes" =~ ^[0-9]+$ && "$final_current_count" == 1 ]] || {
            printf 'Final release artifact pool could not be proven.\n' >&2
            exit 1
          }
          if [ "$final_bytes" -gt "$max_artifact_pool_bytes" ]; then
            printf 'Final repository artifact pool is %s bytes; ceiling is %s bytes.\n' \
              "$final_bytes" "$max_artifact_pool_bytes" >&2
            exit 1
          fi
          printf 'Verified artifact %s; final repository pool is %s bytes.\n' \
            "$current_artifact_id" "$final_bytes"
