name: Application validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  academy-capacity-simulation:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate the published Academy capacity model
        shell: pwsh
        run: ./scripts/Test-AcademyCapacitySimulation.ps1

  validate-python-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.7
      - name: Install locked Python dependencies
        run: uv sync --frozen
      - name: Check Python formatting
        run: uv run ruff format --check packages/python tests
      - name: Check Python lint
        run: uv run ruff check packages/python tests
      - name: Check Python types
        run: uv run mypy packages/python

  validate-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - name: Install locked Node dependencies
        run: pnpm install --frozen-lockfile
      - name: "PRE-VALIDATION: Build Sales Xray static preview"
        env:
          AC_SALES_XRAY_STATIC_PREVIEW: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm --filter @ac/sales-xray-web build
      - name: Check frontend formatting
        run: pnpm exec prettier --check apps packages/typescript package.json pnpm-workspace.yaml .github/workflows/application.yml
      - name: Check frontend lint
        run: pnpm -r --if-present lint
      - name: Check frontend types
        run: pnpm -r --if-present typecheck
      - name: Check frontend tests
        run: pnpm -r --if-present test
      - name: Build frontend packages
        run: pnpm -r --if-present build

  validate-sales-xray-acquisition-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: ac_sales_xray_browser
          POSTGRES_USER: ac_owner
          POSTGRES_PASSWORD: local-owner-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ac_owner -d ac_sales_xray_browser"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      AC_ENVIRONMENT: test
      AC_RELEASE_ID: ci-${{ github.sha }}
      AC_TEST_DATABASE_URL: postgresql+psycopg://ac_owner:local-owner-only@127.0.0.1:5432/ac_sales_xray_browser
      AC_CONVERSATION_POSTGRES_TEST_URL: postgresql+psycopg://ac_owner:local-owner-only@127.0.0.1:5432/ac_sales_xray_browser
      AC_EXTERNAL_SIDE_EFFECTS_HOLD: "true"
      AC_EMAIL_PROVIDER: fake
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.7
      - name: Install locked browser-gate dependencies
        run: pnpm install --frozen-lockfile && uv sync --frozen
      - name: Install FFmpeg prerequisites for acquisition browser
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version
      - name: Install locked acquisition browser
        timeout-minutes: 5
        run: uv run --frozen python -m playwright install --with-deps chromium
      - name: Build verified AudioAtlas for acquisition browser
        run: |
          set -euo pipefail
          command -v g++
          g++ --version
          uv run --frozen python -c 'from ac_platform.conversation_intelligence.signals import build_native, _native_executable; built = build_native(); assert _native_executable(None) == built.resolve()'
      - name: Build Sales Xray production standalone
        env:
          AC_CONVERSATION_API_ORIGIN: http://127.0.0.1:18116
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm --filter @ac/sales-xray-web build
      - name: Require Sales Xray acquisition browser journey
        timeout-minutes: 20
        run: >-
          uv run --frozen python
          scripts/ci/verify_sales_xray_acquisition_browser.py
          --evidence-dir "${{ runner.temp }}/sales-xray-acquisition-browser-${{ github.sha }}"
      - name: Upload sanitized Sales Xray acquisition receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sales-xray-acquisition-browser-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sales-xray-acquisition-browser-${{ github.sha }}/sales-xray-acquisition-browser-receipt.json
            ${{ runner.temp }}/sales-xray-acquisition-browser-${{ github.sha }}/proof.json
            ${{ runner.temp }}/sales-xray-acquisition-browser-${{ github.sha }}/acquisition-browser.junit.xml
          if-no-files-found: error
          retention-days: 14

  validate-python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: ac_platform
          POSTGRES_USER: ac_owner
          POSTGRES_PASSWORD: local-owner-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ac_owner -d ac_platform"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      postgres-recovery-tests:
        image: postgres@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: ac_local_sandbox
          POSTGRES_USER: ac_owner
          POSTGRES_PASSWORD: local-owner-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ac_owner -d ac_local_sandbox"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      AC_ENVIRONMENT: test
      AC_RELEASE_ID: ci-${{ github.sha }}
      AC_DATABASE_URL: postgresql+psycopg://ac_runtime:local-runtime-only@localhost:5432/ac_platform
      AC_DATABASE_MIGRATOR_URL: postgresql+psycopg://ac_migrator:local-migrator-only@localhost:5432/ac_platform
      AC_TEST_DATABASE_URL: postgresql+psycopg://ac_owner:local-owner-only@localhost:5432/ac_platform
      AC_MEDIA_DELIVERY_RENEWAL_POSTGRES_TEST_URL: postgresql+psycopg://ac_owner:local-owner-only@127.0.0.1:55432/ac_local_sandbox
      AC_OPERATIONS_POSTGRES_TEST_URL: postgresql+psycopg://ac_owner:local-owner-only@localhost:5432/ac_platform
      AC_EXTERNAL_SIDE_EFFECTS_HOLD: "true"
      AC_EMAIL_PROVIDER: fake
      AC_REQUIRE_RESTORE_INPUT_DOCKER_TEST: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.7
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile && uv sync --frozen
      - name: "PRE-VALIDATION: Build Sales Xray static preview"
        env:
          AC_SALES_XRAY_STATIC_PREVIEW: "1"
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm --filter @ac/sales-xray-web build
      - name: Require codec and filesystem tools for media regressions
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg e2fsprogs util-linux
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version
      - name: Build verified AudioAtlas for conversation regressions
        run: |
          set -euo pipefail
          command -v g++
          g++ --version
          uv run python -c 'from ac_platform.conversation_intelligence.signals import build_native, _native_executable; built = build_native(); assert _native_executable(None) == built.resolve()'
      - name: Provision least-privilege database roles
        env:
          PGPASSWORD: local-owner-only
        run: >-
          psql --set ON_ERROR_STOP=1
          --host localhost
          --username ac_owner
          --dbname ac_platform
          --file infra/local/postgres/init/001-roles.sql
      - name: Apply and verify PostgreSQL migration chain
        run: uv run alembic upgrade head && uv run alembic check
      - name: Install locked Python browser runtime
        timeout-minutes: 5
        run: uv run --frozen python -m playwright install --with-deps chromium
      - name: Run deterministic Python test shard
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/python-test-shard-${{ matrix.shard }}"
          uv run python scripts/ci/python_test_shard.py run \
            --root "${GITHUB_WORKSPACE}" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 4 \
            --exclude-file scripts/ci/python-test-exclusions.txt \
            --manifest "${RUNNER_TEMP}/python-test-shard-${{ matrix.shard }}/manifest.json" \
            --junitxml "${RUNNER_TEMP}/python-test-shard-${{ matrix.shard }}/junit.xml" \
            --basetemp "${RUNNER_TEMP}/python-test-basetemp-${{ matrix.shard }}"
      - name: Retain Python shard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-test-shard-${{ github.sha }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/python-test-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 14

  validate-python-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: ac_platform
          POSTGRES_USER: ac_owner
          POSTGRES_PASSWORD: local-owner-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ac_owner -d ac_platform"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      postgres-recovery-tests:
        image: postgres@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: ac_local_sandbox
          POSTGRES_USER: ac_owner
          POSTGRES_PASSWORD: local-owner-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ac_owner -d ac_local_sandbox"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      AC_ENVIRONMENT: test
      AC_RELEASE_ID: ci-${{ github.sha }}
      AC_DATABASE_URL: postgresql+psycopg://ac_runtime:local-runtime-only@localhost:5432/ac_platform
      AC_DATABASE_MIGRATOR_URL: postgresql+psycopg://ac_migrator:local-migrator-only@localhost:5432/ac_platform
      AC_TEST_DATABASE_URL: postgresql+psycopg://ac_owner:local-owner-only@localhost:5432/ac_platform
      AC_MEDIA_DELIVERY_RENEWAL_POSTGRES_TEST_URL: postgresql+psycopg://ac_owner:local-owner-only@127.0.0.1:55432/ac_local_sandbox
      AC_OPERATIONS_POSTGRES_TEST_URL: postgresql+psycopg://ac_owner:local-owner-only@localhost:5432/ac_platform
      AC_EXTERNAL_SIDE_EFFECTS_HOLD: "true"
      AC_EMAIL_PROVIDER: fake
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the exact historical backup controller
        run: git cat-file -e '35c658bd028b4fc3a7c048ab72dae700cd7682d6:infra/application/scripts/restore-drill.py'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.7
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile && uv sync --frozen
      - name: Prove root-owned hosted activation and rollback inputs
        run: >-
          sudo env AC_REQUIRE_HOSTED_ACTIVATION_ROOT_TEST=1
          "$PWD/.venv/bin/python" -m pytest
          tests/infra/test_sales_xray_hosted_lifecycle.py
          tests/infra/test_sales_xray_database_provision.py
          -o cache_dir=/run/ac-hosted-activation-pytest-cache
          --junitxml="${{ runner.temp }}/hosted-activation-root.xml"
      - name: Retain hosted activation test receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-activation-root-${{ github.sha }}
          path: ${{ runner.temp }}/hosted-activation-root.xml
          if-no-files-found: error
          retention-days: 14
      - name: Require codec and filesystem tools for media regressions
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg e2fsprogs util-linux
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
          ffprobe -version
      - name: Build verified AudioAtlas for conversation regressions
        run: |
          set -euo pipefail
          command -v g++
          g++ --version
          uv run python -c 'from ac_platform.conversation_intelligence.signals import build_native, _native_executable; built = build_native(); assert _native_executable(None) == built.resolve()'
      - name: Prove the scanner filesystem capacity boundary
        shell: bash
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/scanner-loopback.xml"
          sudo env AC_SCANNER_LOOPBACK_TEST=1 "${GITHUB_WORKSPACE}/.venv/bin/python" \
            -m pytest tests/infra/test_media_safety_temp_filesystem.py -q -r s \
            -p no:cacheprovider --basetemp="${RUNNER_TEMP}/scanner-loopback-tests" \
            --junitxml="${receipt}"
          python - "${receipt}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          assert len(list(root.iter("testcase"))) == 1, "scanner proof did not run"
          assert not list(root.iter("skipped")), "scanner proof was skipped"
          PY
      - name: Create the dedicated migration regression database
        env:
          PGPASSWORD: local-owner-only
        run: >-
          createdb --host 127.0.0.1 --port 55432 --username ac_owner
          ac_migration_rehearsal_ci
      - name: Provision least-privilege database roles
        env:
          PGPASSWORD: local-owner-only
        run: >-
          psql --set ON_ERROR_STOP=1
          --host localhost
          --username ac_owner
          --dbname ac_platform
          --file infra/local/postgres/init/001-roles.sql
      - name: Apply and verify PostgreSQL migration chain
        run: uv run alembic upgrade head && uv run alembic check
      - name: Prove the backup role can dump the migrated schema
        env:
          PGPASSWORD: local-backup-only
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          backup_file="$(mktemp "${RUNNER_TEMP}/ac-backup-role-proof.XXXXXX.dump")"
          trap 'rm -f -- "$backup_file"' EXIT
          umask 077
          docker exec --env PGPASSWORD="$PGPASSWORD" "$POSTGRES_SERVICE_ID" \
            pg_dump --username ac_backup --dbname ac_platform --format=custom --create \
            > "$backup_file"
          docker exec --interactive "$POSTGRES_SERVICE_ID" pg_restore --list \
            < "$backup_file" > /dev/null
      - name: Verify database privilege split
        env:
          PGPASSWORD: local-owner-only
        run: |
          psql --set ON_ERROR_STOP=1 --host localhost --username ac_owner --dbname ac_platform <<'SQL'
          DO $$
          BEGIN
            IF has_schema_privilege('ac_runtime', 'public', 'CREATE') THEN
              RAISE EXCEPTION 'runtime role may create schema objects';
            END IF;
            IF has_database_privilege('ac_runtime', current_database(), 'CREATE')
               OR has_database_privilege('ac_runtime', current_database(), 'TEMP') THEN
              RAISE EXCEPTION 'runtime role may create database or temporary objects';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM pg_roles
              WHERE rolname = 'ac_runtime'
                AND (rolsuper OR rolcreatedb OR rolcreaterole OR rolinherit
                     OR rolreplication OR rolbypassrls)
            ) THEN
              RAISE EXCEPTION 'runtime role has an elevated role attribute';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM pg_tables
              WHERE schemaname = 'public' AND tableowner <> 'ac_migrator'
            ) THEN
              RAISE EXCEPTION 'a migrated table is not owned by the migrator role';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM pg_class relation
              JOIN pg_namespace namespace ON namespace.oid = relation.relnamespace
              JOIN pg_roles owner_role ON owner_role.oid = relation.relowner
              WHERE namespace.nspname = 'public' AND owner_role.rolname = 'ac_runtime'
            ) OR EXISTS (
              SELECT 1
              FROM pg_proc procedure
              JOIN pg_namespace namespace ON namespace.oid = procedure.pronamespace
              JOIN pg_roles owner_role ON owner_role.oid = procedure.proowner
              WHERE namespace.nspname = 'public' AND owner_role.rolname = 'ac_runtime'
            ) THEN
              RAISE EXCEPTION 'runtime role owns a migrated relation or function';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM pg_tables
              WHERE schemaname = 'public'
                AND (
                  has_table_privilege('ac_runtime', format('%I.%I', schemaname, tablename), 'TRUNCATE')
                  OR has_table_privilege('ac_runtime', format('%I.%I', schemaname, tablename), 'REFERENCES')
                  OR has_table_privilege('ac_runtime', format('%I.%I', schemaname, tablename), 'TRIGGER')
                )
            ) THEN
              RAISE EXCEPTION 'runtime role has a forbidden structural table privilege';
            END IF;
          END
          $$;
          SQL
      - name: Prove staging seed PostgreSQL serialization
        env:
          AC_REQUIRE_STAGING_SEED_POSTGRES_TEST: "1"
        run: uv run pytest tests/integration/test_staging_seed_postgresql.py
      - name: Prove catalog publication locking and runtime database boundary
        env:
          AC_REQUIRE_CATALOG_POSTGRES_TEST: "1"
          AC_REQUIRE_DATABASE_RUNTIME_PRIVILEGES_TEST: "1"
          AC_REQUIRE_LEARNING_HTTP_POSTGRES_TEST: "1"
        run: >-
          uv run pytest
          tests/integration/test_catalog_publication_concurrency_postgresql.py
          tests/integration/test_catalog_publication_migration_postgresql.py
          tests/integration/test_database_runtime_privileges_postgresql.py
          tests/integration/test_learning_http_postgresql.py
      - name: Prove Studio draft and revision PostgreSQL production parity
        env:
          AC_REQUIRE_MEDIA_DELIVERY_RENEWAL_POSTGRES_TEST: "1"
        run: >-
          uv run pytest
          tests/integration/test_studio_draft_authoring_postgresql.py
          tests/integration/test_studio_revision_postgresql.py
      - name: Prove worker isolation and operations bootstrap
        env:
          AC_REQUIRE_MEDIA_DELIVERY_RENEWAL_POSTGRES_TEST: "1"
          AC_OPERATIONS_BOOTSTRAP_POSTGRES_TEST_URL: postgresql+psycopg://ac_owner:local-owner-only@127.0.0.1:55432/ac_local_sandbox
          AC_REQUIRE_OPERATIONS_BOOTSTRAP_POSTGRES_TEST: "1"
        run: >-
          uv run pytest
          tests/integration/test_job_kind_isolation_postgresql.py
          tests/integration/test_studio_video_worker_fence_postgresql.py
          tests/integration/test_operations_bootstrap_postgresql.py
      - name: Prove the populated prior-head migration regression
        env:
          AC_MIGRATION_REHEARSAL_POSTGRES_TEST_URL: postgresql+psycopg://ac_owner:local-owner-only@127.0.0.1:55432/ac_migration_rehearsal_ci
          AC_REQUIRE_MIGRATION_REHEARSAL_POSTGRES_TEST: "1"
        run: uv run pytest tests/integration/test_migration_rehearsal_postgresql.py
      - name: Install locked registration browser
        timeout-minutes: 5
        run: uv run --frozen python -m playwright install --with-deps chromium
      - name: Build learner standalone for registration proof
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm --filter @ac/learner-web build
      - name: Prove registration consent and server-rendered readiness
        timeout-minutes: 5
        env:
          AC_REQUIRE_GOOGLE_REGISTRATION_BROWSER_TEST: "1"
          AC_LEARNER_E2E_BASE_URL: http://127.0.0.1:3181
        run: >-
          uv run --frozen python scripts/verify-registration-browser.py
          --evidence-dir "${{ runner.temp }}/registration-browser-${{ github.sha }}"

  validate:
    if: always()
    needs:
      - academy-capacity-simulation
      - validate-python-static
      - validate-frontend
      - validate-sales-xray-acquisition-browser
      - validate-python-tests
      - validate-python-gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Download Python shard evidence
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: python-test-shard-${{ github.sha }}-*
          path: ${{ runner.temp }}/python-test-shards
          merge-multiple: false
      - name: Verify complete Python shard coverage
        if: always()
        run: >-
          python3 scripts/ci/python_test_shard.py verify
          --root "${GITHUB_WORKSPACE}"
          --shard-count 4
          --exclude-file scripts/ci/python-test-exclusions.txt
          --manifest-dir "${{ runner.temp }}/python-test-shards"
      - name: Require every validation component to pass
        if: always()
        env:
          ACADEMY_RESULT: ${{ needs.academy-capacity-simulation.result }}
          PYTHON_STATIC_RESULT: ${{ needs.validate-python-static.result }}
          FRONTEND_RESULT: ${{ needs.validate-frontend.result }}
          SALES_XRAY_ACQUISITION_BROWSER_RESULT: ${{ needs.validate-sales-xray-acquisition-browser.result }}
          PYTHON_TESTS_RESULT: ${{ needs.validate-python-tests.result }}
          PYTHON_GATES_RESULT: ${{ needs.validate-python-gates.result }}
        run: |
          set -euo pipefail
          for result in \
            "$ACADEMY_RESULT" \
            "$PYTHON_STATIC_RESULT" \
            "$FRONTEND_RESULT" \
            "$SALES_XRAY_ACQUISITION_BROWSER_RESULT" \
            "$PYTHON_TESTS_RESULT" \
            "$PYTHON_GATES_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "validation component result was $result" >&2
              exit 1
            fi
          done
  package-release-images:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: application-release-packaging
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      packages: write
    env:
      API_IMAGE: ghcr.io/authorityclosers/authority-closers-api:${{ github.sha }}
      LEARNER_IMAGE: ghcr.io/authorityclosers/authority-closers-learner-web:${{ github.sha }}
      ADMIN_IMAGE: ghcr.io/authorityclosers/authority-closers-admin-web:${{ github.sha }}
      COACH_IMAGE: ghcr.io/authorityclosers/authority-closers-coach-web:${{ github.sha }}
      AC_RELEASE_ARTIFACT_POOL_BYTES: ${{ vars.AC_RELEASE_ARTIFACT_POOL_BYTES || '1000000000' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/application/Dockerfile.python
          target: runtime
          platforms: linux/amd64
          load: true
          tags: ${{ env.API_IMAGE }}
          build-args: |
            AC_RELEASE_ID=${{ github.sha }}
          cache-from: type=gha,scope=application-api
          cache-to: type=gha,mode=max,scope=application-api
      - name: Build learner release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/application/Dockerfile.web
          target: learner
          platforms: linux/amd64
          load: true
          tags: ${{ env.LEARNER_IMAGE }}
          build-args: |
            AC_RELEASE_ID=${{ github.sha }}
          cache-from: type=gha,scope=application-web
          cache-to: type=gha,mode=max,scope=application-web
      - name: Build admin release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/application/Dockerfile.web
          target: admin
          platforms: linux/amd64
          load: true
          tags: ${{ env.ADMIN_IMAGE }}
          build-args: |
            AC_RELEASE_ID=${{ github.sha }}
          cache-from: type=gha,scope=application-web
          cache-to: type=gha,mode=max,scope=application-web
      - name: Build coach release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/application/Dockerfile.web
          target: coach
          platforms: linux/amd64
          load: true
          tags: ${{ env.COACH_IMAGE }}
          build-args: |
            AC_RELEASE_ID=${{ github.sha }}
          cache-from: type=gha,scope=application-web
          cache-to: type=gha,mode=max,scope=application-web
      - name: Prove exact Linux operations image startup before publication
        run: |
          set -euo pipefail
          admin_id="$(docker image inspect --format '{{.Id}}' "$ADMIN_IMAGE")"
          coach_id="$(docker image inspect --format '{{.Id}}' "$COACH_IMAGE")"
          python3 scripts/verify-release-operations-images.py \
            --admin-image "$admin_id" --coach-image "$coach_id" \
            --release-id "$GITHUB_SHA"
      - name: Publish immutable SHA tags
        run: |
          set -euo pipefail
          publish_once() {
            image="$1"
            built_id="$(docker image inspect --format '{{.Id}}' "$image")"
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              docker pull "$image"
              published_id="$(docker image inspect --format '{{.Id}}' "$image")"
              published_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")"
              if [ "$published_revision" != "$GITHUB_SHA" ]; then
                printf 'Refusing to overwrite immutable release tag %s: revision %s (expected %s)\n' "$image" "$published_revision" "$GITHUB_SHA" >&2
                exit 1
              fi
              printf 'Reusing immutable release tag %s (image id %s; rebuilt id %s)\n' "$image" "$published_id" "$built_id"
            else
              docker push "$image"
              docker pull "$image"
            fi
          }
          publish_once "$API_IMAGE"
          publish_once "$LEARNER_IMAGE"
          publish_once "$ADMIN_IMAGE"
          publish_once "$COACH_IMAGE"
      - name: Create transport archives and reviewed manifest
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/ac-application-${GITHUB_SHA}"
          transport_tar="$RUNNER_TEMP/ac-application-${GITHUB_SHA}.tar"
          transport_index="$RUNNER_TEMP/ac-application-${GITHUB_SHA}-index.json"
          mkdir -p "$artifact_dir"
          # One archive deduplicates the shared Node image layers used by the
          # learner, admin and coach runtimes. This keeps the one-day transport
          # artifact inside the GitHub Free storage allowance.
          docker save --output "$transport_tar" \
            "$API_IMAGE" "$LEARNER_IMAGE" "$ADMIN_IMAGE" "$COACH_IMAGE"
          tar --extract --to-stdout --file "$transport_tar" index.json > "$transport_index"

          transport_digest_for() {
            image="$1"
            mapfile -t matches < <(
              jq --raw-output --arg image "$image" \
                '.manifests[] | select(.annotations["io.containerd.image.name"] == $image) | .digest' \
                "$transport_index"
            )
            if [ "${#matches[@]}" -ne 1 ] || ! [[ "${matches[0]}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              printf 'OCI transport index does not contain exactly one manifest for %s\n' "$image" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }

          verify_transport_config() {
            transport_digest="$1"
            expected_config_digest="$2"
            manifest_path="blobs/sha256/${transport_digest#sha256:}"
            actual_transport_digest="sha256:$(
              tar --extract --to-stdout --file "$transport_tar" "$manifest_path" | sha256sum | cut -d' ' -f1
            )"
            [ "$actual_transport_digest" = "$transport_digest" ] || {
              printf 'OCI transport manifest digest verification failed: %s\n' "$transport_digest" >&2
              exit 1
            }
            transported_config_digest="$(
              tar --extract --to-stdout --file "$transport_tar" "$manifest_path" | jq --raw-output '.config.digest'
            )"
            [ "$transported_config_digest" = "$expected_config_digest" ] || {
              printf 'OCI transport manifest does not reference the reviewed image config.\n' >&2
              exit 1
            }
          }

          api_id="$(docker image inspect --format '{{.Id}}' "$API_IMAGE")"
          learner_id="$(docker image inspect --format '{{.Id}}' "$LEARNER_IMAGE")"
          admin_id="$(docker image inspect --format '{{.Id}}' "$ADMIN_IMAGE")"
          coach_id="$(docker image inspect --format '{{.Id}}' "$COACH_IMAGE")"
          api_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$API_IMAGE")"
          learner_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$LEARNER_IMAGE")"
          admin_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$ADMIN_IMAGE")"
          coach_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$COACH_IMAGE")"
          api_release_id="$(
            docker run --rm --network none --entrypoint /bin/sh "$api_id" \
              -c 'cat /app/.ac-release-id'
          )"
          [ "$api_release_id" = "$GITHUB_SHA" ] || {
            printf 'API image release marker does not match the workflow commit.\n' >&2
            exit 1
          }
          mapfile -t migration_heads < <(
            docker run --rm --network none --entrypoint alembic "$api_id" heads \
              | awk '$2 == "(head)" { print $1 }'
          )
          if [ "${#migration_heads[@]}" -ne 1 ] \
            || ! [[ "${migration_heads[0]}" =~ ^[0-9]{8}_[0-9]{4}$ ]]; then
            printf 'API image must contain exactly one valid Alembic head.\n' >&2
            exit 1
          fi
          migration_head="${migration_heads[0]}"
          api_transport_digest="$(transport_digest_for "$API_IMAGE")"
          learner_transport_digest="$(transport_digest_for "$LEARNER_IMAGE")"
          admin_transport_digest="$(transport_digest_for "$ADMIN_IMAGE")"
          coach_transport_digest="$(transport_digest_for "$COACH_IMAGE")"
          verify_transport_config "$api_transport_digest" "$api_id"
          verify_transport_config "$learner_transport_digest" "$learner_id"
          verify_transport_config "$admin_transport_digest" "$admin_id"
          verify_transport_config "$coach_transport_digest" "$coach_id"
          # Ubuntu runners commonly provide pigz through the hosted image's
          # vendor toolchain. Keep gzip as a compatible fallback so compression
          # availability never weakens the release proof.
          if command -v pigz >/dev/null 2>&1; then
            pigz -9 < "$transport_tar" > "$artifact_dir/application-images.tar.gz"
          else
            gzip -9 < "$transport_tar" > "$artifact_dir/application-images.tar.gz"
          fi
          {
            printf 'AC_RELEASE_ID=%s\n' "$GITHUB_SHA"
            # The foundation uses Docker's containerd image store, where an
            # imported OCI image is addressed by its manifest digest. The
            # config ID remains independently bound by verify_transport_config.
            printf 'AC_API_IMAGE=%s\n' "$api_transport_digest"
            printf 'AC_API_REGISTRY_DIGEST=%s\n' "$api_digest"
            printf 'AC_API_TRANSPORT_DIGEST=%s\n' "$api_transport_digest"
            printf 'AC_LEARNER_IMAGE=%s\n' "$learner_transport_digest"
            printf 'AC_LEARNER_REGISTRY_DIGEST=%s\n' "$learner_digest"
            printf 'AC_LEARNER_TRANSPORT_DIGEST=%s\n' "$learner_transport_digest"
            printf 'AC_MIGRATION_HEAD=%s\n' "$migration_head"
            printf 'AC_ADMIN_IMAGE=%s\n' "$admin_transport_digest"
            printf 'AC_ADMIN_REGISTRY_DIGEST=%s\n' "$admin_digest"
            printf 'AC_ADMIN_TRANSPORT_DIGEST=%s\n' "$admin_transport_digest"
            printf 'AC_COACH_IMAGE=%s\n' "$coach_transport_digest"
            printf 'AC_COACH_REGISTRY_DIGEST=%s\n' "$coach_digest"
            printf 'AC_COACH_TRANSPORT_DIGEST=%s\n' "$coach_transport_digest"
          } > "$artifact_dir/release-images.env"
          (
            cd "$artifact_dir"
            sha256sum application-images.tar.gz release-images.env > SHA256SUMS
          )
          python infra/application/scripts/prepare-release-inputs.py \
            verify-bundle "$artifact_dir" "$GITHUB_SHA" > /dev/null
      - name: Admit release artifact under the pooled ceiling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/ac-application-${GITHUB_SHA}"
          candidate_bytes="$(du --bytes --summarize "$artifact_dir" | cut -f1)"
          max_artifact_bytes=450000000
          max_artifact_pool_bytes="$(python infra/release/validate-artifact-pool.py)"
          if [ "$candidate_bytes" -gt "$max_artifact_bytes" ]; then
            printf 'Release artifact is %s bytes; refusing upload above %s bytes.\n' \
              "$candidate_bytes" "$max_artifact_bytes" >&2
            exit 1
          fi

          list_repository_artifacts() {
            gh api --paginate \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              | jq --slurp '[.[].artifacts[]]'
          }

          artifacts_before="$RUNNER_TEMP/repository-artifacts-before.json"
          list_repository_artifacts > "$artifacts_before"
          retained_bytes="$(jq '[.[].size_in_bytes] | add // 0' "$artifacts_before")"
          [[ "$retained_bytes" =~ ^[0-9]+$ ]] || {
            printf 'Repository artifact usage could not be proven.\n' >&2
            exit 1
          }
          # The verified upload step below removes every superseded
          # ac-application bundle. Exclude those exact, reviewable bundles
          # from admission so stale release history cannot block a new
          # immutable candidate while unrelated artifacts remain counted.
          superseded_release_bytes="$(jq '[.[]
            | select((.name // "") | test("^ac-application-[0-9a-f]{40}$"))
            | .size_in_bytes] | add // 0' "$artifacts_before")"
          [[ "$superseded_release_bytes" =~ ^[0-9]+$ && "$superseded_release_bytes" -le "$retained_bytes" ]] || {
            printf 'Superseded release artifact usage could not be proven.\n' >&2
            exit 1
          }
          projected_artifact_pool_bytes=$((retained_bytes - superseded_release_bytes + candidate_bytes))
          if [ "$projected_artifact_pool_bytes" -gt "$max_artifact_pool_bytes" ]; then
            printf 'Projected repository artifact pool is %s bytes; refusing upload above %s bytes.\n' \
              "$projected_artifact_pool_bytes" "$max_artifact_pool_bytes" >&2
            exit 1
          fi
          printf 'Release artifact is %s bytes; projected repository pool is %s bytes (ceiling %s).\n' \
            "$candidate_bytes" "$projected_artifact_pool_bytes" "$max_artifact_pool_bytes"
      - name: Upload reviewed release bundle
        id: upload_release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ac-application-${{ github.sha }}
          path: ${{ runner.temp }}/ac-application-${{ github.sha }}
          if-no-files-found: error
          # The transport bundle is copied into the immutable VPS artifact
          # store. Keep GitHub Actions storage below the Free-plan allowance.
          retention-days: 1
      - name: Reclaim superseded release artifacts after verified upload
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOADED_ARTIFACT_ID: ${{ steps.upload_release.outputs.artifact-id }}
        run: |
          set -euo pipefail
          max_artifact_pool_bytes="$(python infra/release/validate-artifact-pool.py)"
          current_name="ac-application-${GITHUB_SHA}"
          current_artifact_id="$UPLOADED_ARTIFACT_ID"
          [[ "$current_artifact_id" =~ ^[0-9]+$ ]] || {
            printf 'Uploaded release artifact identity is malformed.\n' >&2
            exit 1
          }

          list_repository_artifacts() {
            gh api --paginate \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              | jq --slurp '[.[].artifacts[]]'
          }

          uploaded_artifact="$RUNNER_TEMP/uploaded-release-artifact.json"
          uploaded_artifact_proven=0
          for _attempt in 1 2 3 4 5; do
            if gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${current_artifact_id}" \
              > "$uploaded_artifact" \
              && jq --exit-status \
                --arg current "$current_name" \
                --argjson artifact_id "$current_artifact_id" \
                --argjson run_id "$GITHUB_RUN_ID" \
                '.id == $artifact_id
                 and .name == $current
                 and .workflow_run.id == $run_id
                 and .expired == false
                 and .size_in_bytes > 0' \
                "$uploaded_artifact" > /dev/null; then
              uploaded_artifact_proven=1
              break
            fi
            sleep 2
          done
          [[ "$uploaded_artifact_proven" == 1 ]] || {
            printf 'Uploaded release artifact could not be proven for this workflow run.\n' >&2
            exit 1
          }

          artifacts_after_upload="$RUNNER_TEMP/repository-artifacts-after-upload.json"
          list_repository_artifacts > "$artifacts_after_upload"
          mapfile -t superseded_artifact_ids < <(
            jq --raw-output --argjson current_id "$current_artifact_id" \
              '.[]
               | select((.name // "") | test("^ac-application-[0-9a-f]{40}$"))
               | select(.id != $current_id)
               | .id' \
              "$artifacts_after_upload"
          )
          for artifact_id in "${superseded_artifact_ids[@]}"; do
            [[ "$artifact_id" =~ ^[0-9]+$ ]] || {
              printf 'Refusing malformed superseded release artifact identity.\n' >&2
              exit 1
            }
            gh api --method DELETE \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

          artifacts_final="$RUNNER_TEMP/repository-artifacts-final.json"
          list_repository_artifacts > "$artifacts_final"
          final_bytes="$(jq '[.[].size_in_bytes] | add // 0' "$artifacts_final")"
          final_current_count="$(
            jq --argjson current_id "$current_artifact_id" \
              '[.[] | select(.id == $current_id)] | length' "$artifacts_final"
          )"
          [[ "$final_bytes" =~ ^[0-9]+$ && "$final_current_count" == 1 ]] || {
            printf 'Final release artifact pool could not be proven.\n' >&2
            exit 1
          }
          if [ "$final_bytes" -gt "$max_artifact_pool_bytes" ]; then
            printf 'Final repository artifact pool is %s bytes; ceiling is %s bytes.\n' \
              "$final_bytes" "$max_artifact_pool_bytes" >&2
            exit 1
          fi
          printf 'Verified artifact %s; final repository pool is %s bytes.\n' \
            "$current_artifact_id" "$final_bytes"
