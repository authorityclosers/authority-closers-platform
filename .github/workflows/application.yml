name: Application validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: ac_platform
          POSTGRES_USER: ac_owner
          POSTGRES_PASSWORD: local-owner-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ac_owner -d ac_platform"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      AC_ENVIRONMENT: test
      AC_RELEASE_ID: ci-${{ github.sha }}
      AC_DATABASE_URL: postgresql+psycopg://ac_runtime:local-runtime-only@localhost:5432/ac_platform
      AC_DATABASE_MIGRATOR_URL: postgresql+psycopg://ac_migrator:local-migrator-only@localhost:5432/ac_platform
      # Fresh-schema PostgreSQL acceptance suites require a disposable database
      # owner so they can create and drop their isolated search paths. The CI
      # service itself is ephemeral; production never exposes this credential.
      AC_TEST_DATABASE_URL: postgresql+psycopg://ac_owner:local-owner-only@localhost:5432/ac_platform
      AC_OPERATIONS_POSTGRES_TEST_URL: postgresql+psycopg://ac_owner:local-owner-only@localhost:5432/ac_platform
      AC_EXTERNAL_SIDE_EFFECTS_HOLD: "true"
      AC_EMAIL_PROVIDER: fake
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.7
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile && uv sync --frozen
      - name: Provision least-privilege database roles
        env:
          PGPASSWORD: local-owner-only
        run: >-
          psql --set ON_ERROR_STOP=1
          --host localhost
          --username ac_owner
          --dbname ac_platform
          --file infra/local/postgres/init/001-roles.sql
      - name: Apply and verify PostgreSQL migration chain
        run: uv run alembic upgrade head && uv run alembic check
      - name: Verify database privilege split
        env:
          PGPASSWORD: local-owner-only
        run: |
          psql --set ON_ERROR_STOP=1 --host localhost --username ac_owner --dbname ac_platform <<'SQL'
          DO $$
          BEGIN
            IF has_schema_privilege('ac_runtime', 'public', 'CREATE') THEN
              RAISE EXCEPTION 'runtime role may create schema objects';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM pg_tables
              WHERE schemaname = 'public' AND tableowner <> 'ac_migrator'
            ) THEN
              RAISE EXCEPTION 'a migrated table is not owned by the migrator role';
            END IF;
          END
          $$;
          SQL
      - name: Validate application
        run: pnpm validate

  package-release-images:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      API_IMAGE: ghcr.io/authorityclosers/authority-closers-api:${{ github.sha }}
      LEARNER_IMAGE: ghcr.io/authorityclosers/authority-closers-learner-web:${{ github.sha }}
      ADMIN_IMAGE: ghcr.io/authorityclosers/authority-closers-admin-web:${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build API release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/application/Dockerfile.python
          target: runtime
          platforms: linux/amd64
          load: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=application-api
          cache-to: type=gha,mode=max,scope=application-api
      - name: Build learner release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/application/Dockerfile.web
          target: learner
          platforms: linux/amd64
          load: true
          tags: ${{ env.LEARNER_IMAGE }}
          cache-from: type=gha,scope=application-web
          cache-to: type=gha,mode=max,scope=application-web
      - name: Build admin release image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: infra/application/Dockerfile.web
          target: admin
          platforms: linux/amd64
          load: true
          tags: ${{ env.ADMIN_IMAGE }}
          cache-from: type=gha,scope=application-web
          cache-to: type=gha,mode=max,scope=application-web
      - name: Publish immutable SHA tags
        run: |
          set -euo pipefail
          publish_once() {
            image="$1"
            built_id="$(docker image inspect --format '{{.Id}}' "$image")"
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              docker pull "$image"
              published_id="$(docker image inspect --format '{{.Id}}' "$image")"
              if [ "$published_id" != "$built_id" ]; then
                printf 'Refusing to overwrite immutable release tag %s\n' "$image" >&2
                exit 1
              fi
            else
              docker push "$image"
              docker pull "$image"
            fi
          }
          publish_once "$API_IMAGE"
          publish_once "$LEARNER_IMAGE"
          publish_once "$ADMIN_IMAGE"
      - name: Create transport archives and reviewed manifest
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/ac-application-${GITHUB_SHA}"
          mkdir -p "$artifact_dir"
          # One archive deduplicates the shared Node image layers used by the
          # learner and admin runtimes. This keeps the one-day transport
          # artifact inside the GitHub Free storage allowance.
          docker save "$API_IMAGE" "$LEARNER_IMAGE" "$ADMIN_IMAGE" \
            | gzip -9 > "$artifact_dir/application-images.tar.gz"
          api_id="$(docker image inspect --format '{{.Id}}' "$API_IMAGE")"
          learner_id="$(docker image inspect --format '{{.Id}}' "$LEARNER_IMAGE")"
          admin_id="$(docker image inspect --format '{{.Id}}' "$ADMIN_IMAGE")"
          api_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$API_IMAGE")"
          learner_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$LEARNER_IMAGE")"
          admin_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$ADMIN_IMAGE")"
          {
            printf 'AC_RELEASE_ID=%s\n' "$GITHUB_SHA"
            printf 'AC_API_IMAGE=%s\n' "$api_id"
            printf 'AC_API_REGISTRY_DIGEST=%s\n' "$api_digest"
            printf 'AC_LEARNER_IMAGE=%s\n' "$learner_id"
            printf 'AC_LEARNER_REGISTRY_DIGEST=%s\n' "$learner_digest"
            printf 'AC_ADMIN_IMAGE=%s\n' "$admin_id"
            printf 'AC_ADMIN_REGISTRY_DIGEST=%s\n' "$admin_digest"
          } > "$artifact_dir/release-images.env"
          (
            cd "$artifact_dir"
            sha256sum application-images.tar.gz release-images.env > SHA256SUMS
          )
      - name: Enforce GitHub Free artifact ceiling
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/ac-application-${GITHUB_SHA}"
          artifact_bytes="$(du --bytes --summarize "$artifact_dir" | cut -f1)"
          max_artifact_bytes=450000000
          if [ "$artifact_bytes" -gt "$max_artifact_bytes" ]; then
            printf 'Release artifact is %s bytes; refusing upload above %s bytes.\n' \
              "$artifact_bytes" "$max_artifact_bytes" >&2
            exit 1
          fi
          printf 'Release artifact is %s bytes (ceiling %s).\n' \
            "$artifact_bytes" "$max_artifact_bytes"
      - name: Upload reviewed release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ac-application-${{ github.sha }}
          path: ${{ runner.temp }}/ac-application-${{ github.sha }}
          if-no-files-found: error
          # The transport bundle is copied into the immutable VPS artifact
          # store. Keep GitHub Actions storage below the Free-plan allowance.
          retention-days: 1
