name: Application validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_DB: ac_platform
          POSTGRES_USER: ac_owner
          POSTGRES_PASSWORD: local-owner-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ac_owner -d ac_platform"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      AC_ENVIRONMENT: test
      AC_RELEASE_ID: ci-${{ github.sha }}
      AC_DATABASE_URL: postgresql+psycopg://ac_owner:local-owner-only@localhost:5432/ac_platform
      AC_DATABASE_MIGRATOR_URL: postgresql+psycopg://ac_owner:local-owner-only@localhost:5432/ac_platform
      AC_EXTERNAL_SIDE_EFFECTS_HOLD: "true"
      AC_EMAIL_PROVIDER: fake
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.12.7
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile && uv sync --frozen
      - name: Validate application
        run: pnpm validate
