name: Migration safety

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migration-safety:
    name: migration-safety
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install locked migration tooling
        run: python -m pip install --disable-pip-version-check uv==0.12.7 && uv sync --frozen
      - name: Prove gate behavior with fictional PostgreSQL fixtures
        env:
          AC_REQUIRE_SCHEMA_GATE_DOCKER_TEST: "1"
        run: >-
          uv run --frozen pytest
          tests/infra/test_migration_schema_gate.py
          tests/infra/test_postgres_schema_export.py
          tests/infra/test_migration_schema_publication.py
      - name: Detect migration scope
        id: scope
        run: |
          set -euo pipefail
          relevant="$(uv run --frozen python scripts/ci/migration_schema_gate.py --base-ref "$BASE_SHA" --scope-only)"
          [[ "$relevant" == true || "$relevant" == false ]]
          printf 'relevant=%s\n' "$relevant" >> "$GITHUB_OUTPUT"
      # Staging's live schema is rehearsed where it lives: ac-ship runs the same gate on a fresh staging
      # export on the server while this CI runs (infra/release/rehearse-staging-migrations.py, AUT-2215).
      # This check needs no published artifact: it rehearses on the baseline the migrations build.
      - name: Rehearse candidate migrations
        run: >-
          uv run --frozen python scripts/ci/migration_schema_gate.py
          --base-ref "$BASE_SHA"
          --baseline-from-migrations
      - name: Publish one-line required-check summary
        if: always()
        env:
          RESULT: ${{ job.status }}
          RELEVANT: ${{ steps.scope.outputs.relevant }}
        run: |
          if [[ "$RESULT" == success ]]; then
            if [[ "$RELEVANT" == true ]]; then
              summary='migration-safety: PASS (upgrade, downgrade, schema comparison, re-upgrade)'
            else
              summary='migration-safety: PASS (no migration changes)'
            fi
          else
            summary='migration-safety: FAIL (see gate or prerequisite failure)'
          fi
          printf '%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
