name: Migration safety

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: migration-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migration-safety:
    name: migration-safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      SCHEMA_MANIFEST_SHA256: ${{ vars.AC_MIGRATION_SCHEMA_MANIFEST_SHA256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install locked migration tooling
        run: python -m pip install --disable-pip-version-check uv==0.12.7 && uv sync --frozen
      - name: Prove gate behavior with fictional PostgreSQL fixtures
        env:
          AC_REQUIRE_SCHEMA_GATE_DOCKER_TEST: "1"
        run: >-
          uv run --frozen pytest
          tests/infra/test_migration_schema_gate.py
          tests/infra/test_postgres_schema_export.py
      - name: Detect migration scope
        id: scope
        run: |
          set -euo pipefail
          relevant="$(uv run --frozen python scripts/ci/migration_schema_gate.py --base-ref "$BASE_SHA" --scope-only)"
          [[ "$relevant" == true || "$relevant" == false ]]
          printf 'relevant=%s\n' "$relevant" >> "$GITHUB_OUTPUT"
      - name: Require governed schema artifact identity
        id: artifact
        if: steps.scope.outputs.relevant == 'true'
        env:
          SCHEMA_ARTIFACT_ID: ${{ vars.AC_MIGRATION_SCHEMA_ARTIFACT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SCHEMA_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SCHEMA_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SCHEMA_ARTIFACT_ID}")"
          run_id="$(jq --exit-status --raw-output --argjson id "$SCHEMA_ARTIFACT_ID" \
            'select(.id == $id and .expired == false) | .workflow_run.id | select(type == "number" and . > 0)' <<< "$metadata")"
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
      - name: Download only the governed schema bundle
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ vars.AC_MIGRATION_SCHEMA_ARTIFACT_ID }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.artifact.outputs.run-id }}
          path: ${{ runner.temp }}/migration-schema
          merge-multiple: true
      - name: Rehearse candidate migrations
        run: >-
          uv run --frozen python scripts/ci/migration_schema_gate.py
          --base-ref "$BASE_SHA"
          --artifact-dir "${{ runner.temp }}/migration-schema"
          --manifest-sha256 "$SCHEMA_MANIFEST_SHA256"
      - name: Publish one-line required-check summary
        if: always()
        env:
          RESULT: ${{ job.status }}
          RELEVANT: ${{ steps.scope.outputs.relevant }}
        run: |
          if [[ "$RESULT" == success ]]; then
            if [[ "$RELEVANT" == true ]]; then
              summary='migration-safety: PASS (upgrade, downgrade, schema comparison, re-upgrade)'
            else
              summary='migration-safety: PASS (no migration changes)'
            fi
          else
            summary='migration-safety: FAIL (see gate or prerequisite failure)'
          fi
          printf '%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
